          faltaram.slice(0, 8).join("\n") + (faltaram.length > 8 ? "\n..." : "") +
          "\n\nConfira essas antes de dar baixa, e tente baixar o zip de novo daqui a pouco.");
      }
      return blobs;
    }).then(function (blobs) {
      var zip = new JSZip();
      // O Google Fotos não agrupa "por nome" — ele ordena os álbuns/pastas
      // pela data da foto mais recente ali dentro, e as fotos daqui não
      // carregam data própria (viram canvas na hora de comprimir/tirar,
      // perdem o EXIF), então ele cai pra data do arquivo. Aqui a gente
      // CARIMBA essa data explicitamente no zip, decrescendo uma a uma na
      // ordem certa (o primeiro item fica com a foto "mais recente", o
      // último com a mais antiga) — é o que faz o Google Fotos (que mostra o
      // mais recente primeiro) respeitar a mesma ordem da lista.
      var agora = Date.now();
      itensParaBuscar.forEach(function (it, i) {
        if (blobs[i]) zip.folder(it.nomePasta).file(it.nomeArquivo, blobs[i], { date: new Date(agora - i * 10000) });
      });
      return zip.generateAsync({ type: "blob" });
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = nomeArquivoZip;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      aoTerminar();
    }).catch(function () {
      aoTerminar();
    });
  }

  // Foto que ainda está na fila de reenvio NÃO está no Firebase, logo não
  // entra no zip. Baixar sem saber disso é dar baixa com comprovante
  // faltando — por isso avisa e deixa escolher.
  function confirmarPendentesAntesDoZip() {
    if (!state.filaPendente.length) return true;
    return confirm("Ainda " + (state.filaPendente.length === 1 ? "tem 1 foto que não subiu" : "tem " + state.filaPendente.length + " fotos que não subiram") + " — " +
      (state.filaPendente.length === 1 ? "ela não vai" : "elas não vão") + " entrar neste zip.\n\n" +
      "O melhor é tocar em \"tentar agora\" no aviso de pendentes e esperar zerar.\n\nBaixar assim mesmo?");
  }

  function baixarFotosDoDia() {
    if (!fbDb || !state.minhaRota || typeof JSZip === "undefined" || state.baixandoZip) return;
    if (!confirmarPendentesAntesDoZip()) return;
    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var data = dataDeHoje();
    state.baixandoZip = true;
    state.baixandoZipChave = null;
    render();

    Promise.all([
      fbDb.ref("lotes/" + chaveRota + "/entregas/" + data).once("value"),
      fbDb.ref("lotes/" + chaveRota + "/fachadas_permanentes").once("value")
    ]).then(function (resultados) {
      var porChave = montarGruposParaZip(resultados[0].val() || {}, resultados[1].val() || {});
      var chavesOrdenadas = Object.keys(porChave).sort();
      if (chavesOrdenadas.length === 0) {
        state.baixandoZip = false;
        render();
        return;
      }

      // Largura do zero à esquerda cresce com o total de endereços do dia,
      // pra "001_", "002_"... continuar ordenando certinho mesmo se a rota
      // (agora somando você + ajudante) passar de 99 endereços num dia só.
      var digitosOrdem = Math.max(2, String(chavesOrdenadas.length).length);
      var itensParaBuscar = [];
      chavesOrdenadas.forEach(function (chave, idx) {
        var g = porChave[chave];
        var prefixo = String(idx + 1).padStart(digitosOrdem, "0");
        itensParaBuscar = itensParaBuscar.concat(itensParaZipDoGrupo(g, nomePastaZip(g, prefixo)));
      });

      gerarEBaixarZip(itensParaBuscar, "fotos-" + chaveRota + "-" + data + ".zip", function () {
        state.baixandoZip = false;
        render();
      });
    }).catch(function () {
      state.baixandoZip = false;
      render();
    });
  }

  // "Baixar" de um endereço só, direto na lista — pra quem dá baixa no app
  // da J&T não precisar esperar o dia inteiro terminar pra começar a
  // processar. Reusa o mesmo agrupamento e nomeação do zip do dia inteiro
  // (montarGruposParaZip/nomePastaZip/itensParaZipDoGrupo), então o nome da
  // pasta e dos arquivos sai idêntico ao que sairia lá dentro do zip grande
  // — só que sem o número de ordem na frente, que só faz sentido quando tem
  // mais de uma pasta no mesmo zip.
  function baixarFotosDoEndereco(chaveEndereco) {
    if (!fbDb || !state.minhaRota || typeof JSZip === "undefined" || state.baixandoZip) return;
    if (!confirmarPendentesAntesDoZip()) return;
    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var data = dataDeHoje();
    state.baixandoZip = true;
    state.baixandoZipChave = chaveEndereco;
    render();

    Promise.all([
      fbDb.ref("lotes/" + chaveRota + "/entregas/" + data).once("value"),
      fbDb.ref("lotes/" + chaveRota + "/fachadas_permanentes").once("value")
    ]).then(function (resultados) {
      var porChave = montarGruposParaZip(resultados[0].val() || {}, resultados[1].val() || {});
      var g = porChave[chaveEndereco];
      if (!g) {
        state.baixandoZip = false;
        state.baixandoZipChave = null;
        render();
        return;
      }
      var nomePasta = nomePastaZip(g, null);
      var itensParaBuscar = itensParaZipDoGrupo(g, nomePasta);
      gerarEBaixarZip(itensParaBuscar, "fotos-" + chaveRota + "-" + data + "_" + nomePasta + ".zip", function () {
        state.baixandoZip = false;
        state.baixandoZipChave = null;
        render();
      });
    }).catch(function () {
      state.baixandoZip = false;
      state.baixandoZipChave = null;
      render();
    });
  }

  function calcularResultado() {
    if (!state.linhasParseadas) return null;
    var splits = calcularSplitsPorRua();
    var validas = state.linhasParseadas.filter(function (l) { return !l.erro; });
    var erros = state.linhasParseadas.filter(function (l) { return l.erro; });
    var naoMapeadas = {};
    var porGrupo = {};

    validas.forEach(function (l) {
      var ruaMatch = encontrarRuaMapeada(l.rua, state.mapaRuas);
      if (!ruaMatch) {
        // Antes, pacote de rua fora das Faixas simplesmente SUMIA da aba Hoje:
        // não entrava em nenhuma caixa, não dava pra marcar e — o pior — não
        // entrava na conta de "separados". O contador chegava, por exemplo, em
        // "70/70" e travava ali, mesmo com 30 pacotes ainda por separar.
        // Agora eles ganham uma caixa cinza própria no fim da lista: aparecem,
        // dá pra separar, e a conta bate com o tamanho real da lista.
        naoMapeadas[l.rua] = true;
        var keySem = "SEMFAIXA|" + normalizar(l.rua);
        if (!porGrupo[keySem]) porGrupo[keySem] = { ruaNome: l.rua, label: "SEM FAIXA", cor: COR_SEM_FAIXA, itens: [], semFaixa: true };
        porGrupo[keySem].itens.push(l);
        return;
      }
      // classificar() devolve null quando o número não começa com dígito
      // ("S/N", "KM 5", "LOTE 2", "Bloco B"...). Isso é comum em endereço
      // brasileiro de verdade, e antes derrubava a aba Hoje INTEIRA: uma
      // linha assim numa rua cadastrada estourava aqui, a tela parava de
      // montar e nem mensagem de erro aparecia — no aparelho de quem colou e
      // no de todo mundo que recebia a lista pela nuvem. Agora esses pacotes
      // caem na mesma caixa cinza dos de rua sem faixa: aparecem, dá pra
      // separar e fotografar, e entram na conta certinho.
      var c = classificar(l.numero, ruaMatch, splits);
      if (!c) {
        var keySemNum = "SEMNUMERO|" + ruaMatch.id;
        if (!porGrupo[keySemNum]) porGrupo[keySemNum] = { ruaNome: ruaMatch.nome, label: "SEM Nº", cor: COR_SEM_FAIXA, itens: [], semFaixa: true };
        porGrupo[keySemNum].itens.push(l);
        return;
      }
      var key = ruaMatch.id + "|" + c.cor;
      if (!porGrupo[key]) porGrupo[key] = { ruaNome: ruaMatch.nome, label: c.label, cor: c.cor, itens: [] };
      porGrupo[key].itens.push(l);
    });

    var listaGrupos = Object.keys(porGrupo).map(function (k) {
      var g = porGrupo[k];
      var itens = g.itens.slice().sort(function (a, b) { return ordenarNumerico(a.numero, b.numero); });
      return { ruaNome: g.ruaNome, label: g.label, cor: g.cor, itens: itens, total: itens.length, semFaixa: !!g.semFaixa };
    }).sort(function (a, b) {
      // as caixas "sem faixa" ficam sempre no fim, pra não atrapalhar quem
      // está separando pelas cores.
      if (a.semFaixa !== b.semFaixa) return a.semFaixa ? 1 : -1;
      var rc = String(a.ruaNome || "").localeCompare(String(b.ruaNome || ""), "pt-BR");
      // String(... || "") em vez de usar direto: uma configuração de faixa
      // antiga/incompleta (cor faltando) estourava aqui e derrubava a tela
      // pelo mesmo caminho do "S/N".
      return rc !== 0 ? rc : String(a.cor || "").localeCompare(String(b.cor || ""));
    });

    // Código repetido em mais de uma linha (às vezes a própria lista vem
    // assim, de erro no sistema de quem gerou a rota) é um jeito silencioso
    // do contador "travar": ao escanear, o app sempre achava a PRIMEIRA linha
    // com aquele código — se ela já tinha sido separada, escanear as outras
    // encomendas com o mesmo código não fazia nada (nem esquenta, nem
    // esfria), então o número parava de subir mesmo com pacotes de verdade
    // ainda sendo separados. Ver processarCodigoLido pra a mudança que
    // resolve o "travar" em si — isto aqui é só o aviso pra facilitar achar
    // a causa quando for a lista.
    var porCodigo = {};
    validas.forEach(function (l) { if (l.codigo) (porCodigo[l.codigo] = porCodigo[l.codigo] || []).push(l); });
    var duplicados = Object.keys(porCodigo).filter(function (c) { return porCodigo[c].length > 1; })
      .map(function (c) { return { codigo: c, vezes: porCodigo[c].length }; });

    return { listaGrupos: listaGrupos, naoMapeadas: Object.keys(naoMapeadas), erros: erros, duplicados: duplicados };
  }

  // ---------- câmera ----------
  var streamAtual = null;
  var ultimoScan = { chave: null, ts: 0 };

  function pararCamera() {
    if (streamAtual) { streamAtual.getTracks().forEach(function (t) { t.stop(); }); streamAtual = null; }
    state.statusCamera = "idle";
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && streamAtual) {
      pararCamera();
      render();
    }
    if (document.hidden && streamLote) {
      pararCameraLote();
      if (state.loteFoto) state.loteFoto.statusCamera = "idle";
      render();
    }
    if (!document.hidden) tentarReenviarFila();
  });

  window.addEventListener("online", function () {
    tentarReenviarFila();
  });

  // Bipe curto e discreto ao separar com sucesso (mesma ideia dos leitores de
  // código de barras do galpão) — sintetizado na hora (sem precisar de
  // arquivo de áudio), então funciona offline igual ao resto do app. Fica em
  // silêncio nos casos de erro (código não encontrado / sem lista), a pedido
  // do usuário. Um dos dois pode desligar sozinho no aparelho dele, sem
  // afetar o outro (fica salvo só localmente, não é uma config da rota).
  var audioCtxBipe = null;
  // Cria e destrava o áudio a partir de um TOQUE de verdade (abrir a câmera,
  // ligar o bipe). No iPhone, um AudioContext criado dentro de um retorno da
  // câmera nasce "suspended" e nunca mais toca — o operador achava que o app
  // não tinha lido. Chamando daqui, o navegador aceita.
  function prepararAudioBipe() {
    try {
      if (!audioCtxBipe) audioCtxBipe = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtxBipe.state === "suspended") audioCtxBipe.resume();
    } catch (e) { /* aparelho sem suporte a áudio — segue sem bipe */ }
  }
  function tocarBipeSucesso() {
    if (!state.bipeAtivo) return;
    try {
      if (!audioCtxBipe) audioCtxBipe = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtxBipe.state === "suspended") audioCtxBipe.resume();
      var agora = audioCtxBipe.currentTime;
      var osc = audioCtxBipe.createOscillator();
      var gain = audioCtxBipe.createGain();
      osc.type = "sine";
      osc.frequency.value = 1046.5;
      gain.gain.setValueAtTime(0.0001, agora);
      gain.gain.exponentialRampToValueAtTime(0.12, agora + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, agora + 0.11);
      osc.connect(gain);
      gain.connect(audioCtxBipe.destination);
      osc.start(agora);
      osc.stop(agora + 0.12);
    } catch (e) {
      // Sem suporte a áudio ou bloqueado pelo navegador — só não bipa.
    }
  }
  function alternarBipe() {
    state.bipeAtivo = !state.bipeAtivo;
    salvar("bipe-ativo", state.bipeAtivo);
    if (state.bipeAtivo) { prepararAudioBipe(); tocarBipeSucesso(); }
    render();
  }

  // Flash de tela cheia com a cor da faixa, por cima da câmera, logo após um
  // bipe de sucesso — pensado pra jogar o pacote direto num saco/compartimento
  // já rotulado com essa mesma cor, sem precisar ler nada, em vez de ensacar
  // tudo junto e separar de novo na rua. Some sozinho rápido pra não atrapalhar
  // o próximo escaneamento; cada novo escaneamento reinicia a contagem, então
  // nunca some "cedo demais" por causa de um flash anterior ainda correndo.
  var flashTimeoutId = null;
  function agendarFlashScan(classificacao, rua, numero) {
    if (flashTimeoutId) clearTimeout(flashTimeoutId);
    state.flashScan = { cor: classificacao.cor, label: classificacao.label, rua: rua, numero: numero };
    flashTimeoutId = setTimeout(function () {
      flashTimeoutId = null;
      state.flashScan = null;
      render();
    }, 800);
  }

  function processarCodigoLido(codigo) {
    // As etiquetas da J&T costumam trazer mais de um código: o de rastreio
    // (sempre 15 dígitos, é o que interessa pra separação) e, em baixo, o
    // código de barras de 44 dígitos da nota fiscal eletrônica (chave de
    // acesso NF-e). Pra câmera nunca confundir um com outro nem mostrar
    // aviso de "não encontrado" pra quem não é pacote, dois filtros
    // redundantes de propósito (reforço, a pedido do Sérgio):
    // 1) ignora por completo qualquer código de 44 dígitos;
    // 2) só segue adiante quem tem o formato de rastreio — 15 dígitos, com o
    //    sufixo de peça (-001, -002...) opcional, porque pedido com mais de
    //    uma peça é exatamente assim que vem da API e é assim que a etiqueta
    //    pode estar impressa. Qualquer outro formato (incluindo o de 44) é
    //    tratado como se a câmera não tivesse lido nada: sem aviso, sem beep,
    //    sem interromper a leitura.
    if (/^\d{44}$/.test(codigo)) return;
    codigo = String(codigo).trim();
    if (!FORMATO_CODIGO.test(codigo)) return;

    var agora = Date.now();

    if (!state.linhasParseadas) {
      // Debounce simples pelo código bruto: aqui não tem "linha" nenhuma pra
      // usar de chave, é só pra não ficar re-renderizando o mesmo aviso a
      // cada quadro enquanto a câmera continua vendo a mesma etiqueta.
      if (ultimoScan.chave === "semlista" && agora - ultimoScan.ts < 2500) return;
      ultimoScan = { chave: "semlista", ts: agora };
      state.resultadoScan = { encontrado: false, semLista: true, codigo: codigo };
      render();
      return;
    }
    // Quando o mesmo código aparece em mais de uma linha (lista com código
    // repetido — ver aviso em calcularResultado), escanear sempre pegava a
    // PRIMEIRA linha daquele código. Se ela já tinha sido separada antes,
    // escanear as próximas encomendas com esse mesmo código não fazia nada:
    // nem erro, nem separação nova — o contador simplesmente parava de subir
    // mesmo com pacotes de verdade passando pela câmera. Agora prefere uma
    // linha AINDA NÃO separada daquele código (se houver uma), então cada
    // encomenda física com o código repetido avança uma linha diferente em
    // vez de martelar sempre a mesma.
    // Primeiro tenta o código exato; se não houver, casa pela BASE do rastreio.
    // É isso que faz um pedido de 5 peças funcionar: a lista tem -001..-005 e
    // a etiqueta na mão pode trazer qualquer uma dessas formas (ou só a base).
    // Como logo abaixo a escolha é sempre por uma linha AINDA NÃO separada,
    // bipar as 5 encomendas físicas marca as 5 linhas, uma de cada vez.
    var candidatas = state.linhasParseadas.filter(function (l) { return !l.erro && l.codigo && l.codigo === codigo; });
    if (!candidatas.length) {
      var base = codigoBase(codigo);
      candidatas = state.linhasParseadas.filter(function (l) { return !l.erro && l.codigo && codigoBase(l.codigo) === base; });
    }
    if (!candidatas.length) {
      if (ultimoScan.chave === codigo && agora - ultimoScan.ts < 2500) return;
      ultimoScan = { chave: codigo, ts: agora };
      state.resultadoScan = { encontrado: false, codigo: codigo };
      render();
      return;
    }
    var linha = candidatas.find(function (l) { return !statusDe(l.id).separado; }) || candidatas[0];

    // Evita repetir o bipe/flash/marcação várias vezes seguidas pro MESMO
    // pacote enquanto a câmera ainda está vendo a etiqueta dele nos próximos
    // quadros — mas a chave é a LINHA já resolvida acima, não o código bruto
    // lido. Isso importa justamente no caso de código repetido: duas
    // encomendas físicas diferentes com o mesmo código, escaneadas uma logo
    // depois da outra (bem comum escaneando uma pilha inteira rápido),
    // resolvem pra linhas diferentes acima — se o filtro fosse pelo código
    // bruto, a 2ª ficaria bloqueada achando que era só a câmera vendo de
    // novo a mesma etiqueta, e aquela encomenda nunca seria separada (foi
    // exatamente isso que aconteceu: 100 pacotes escaneados, só 97
    // separados — as 2 encomendas com código repetido escaneadas em
    // sequência rápida perdiam a segunda pra esse filtro).
    if (ultimoScan.chave === linha.id && agora - ultimoScan.ts < 2500) return;

    // Segunda trava, pro caso inverso do de cima. Com código repetido na
    // lista, a MESMA etiqueta parada na frente da câmera é lida em vários
    // quadros seguidos (a cada ~16ms no Android); como a 1ª linha já ficou
    // separada, o quadro seguinte resolvia pra OUTRA linha e marcava ela
    // também — um pacote na mão, dois bipes e +2 no contador.
    // O que separa "a mesma etiqueta de novo" de "a próxima encomenda com o
    // mesmo código" não é o relógio, é o INTERVALO ENTRE QUADROS: a câmera
    // vendo a mesma etiqueta entrega leituras coladas (dezenas por segundo),
    // enquanto trocar de pacote na mão leva pelo menos uns 300ms. Por isso a
    // janela aqui é bem curta — o suficiente pros quadros repetidos, e longe
    // do tempo de passar a próxima encomenda (que continua separando normal,
    // que foi o conserto do "100 escaneados, 97 separados").
    if (ultimoScan.codigoBruto === codigo && agora - ultimoScan.ts < 250) return;
    ultimoScan = { chave: linha.id, codigoBruto: codigo, ts: agora };

    var ruaMatch = encontrarRuaMapeada(linha.rua, state.mapaRuas);
    var classificacao = ruaMatch ? classificar(linha.numero, ruaMatch, calcularSplitsPorRua()) : null;
    state.resultadoScan = { encontrado: true, rua: linha.rua, numero: linha.numero, nome: linha.nome, classificacao: classificacao };
    tocarBipeSucesso();
    if (classificacao) agendarFlashScan(classificacao, linha.rua, linha.numero);
    marcarSeparado(linha.id, true);
  }

  // ---------- leitor de código de reserva (iPhone e afins) ----------
  // O Chrome do Android traz um leitor de código embutido no próprio
  // navegador: rápido, do sistema, sem baixar nada. O Safari do iPhone não
  // traz — e como no iPhone todo navegador roda em cima do Safari, isso vale
  // pro aparelho inteiro. Nesses casos entra o leitor extra (WebAssembly),
  // que lê os mesmos códigos e ainda cobre DataMatrix e PDF417. Ele só é
  // baixado quando alguém abre a câmera num aparelho que precisa — quem está
  // no Android nunca paga esse download.
  var LEITOR_NATIVO = !!window.LEITOR_NATIVO;
  var ARQUIVO_LEITOR = "zxing_reader.wasm";
  var LEITOR_CDN = "https://fastly.jsdelivr.net/npm/zxing-wasm@3.1.3/dist/reader/zxing_reader.wasm";
  var promessaLeitor = null;

  function prepararLeitor() {
    if (LEITOR_NATIVO) return Promise.resolve();
    if (promessaLeitor) return promessaLeitor;
    if (typeof BarcodeDetectionAPI === "undefined" || !BarcodeDetectionAPI.prepareZXingModule) {
      return Promise.reject(new Error("o leitor extra n\u00e3o veio junto com o app"));
    }
    // Primeiro o arquivo publicado ao lado do app (rápido e sem depender de
    // ninguém); se ele não tiver sido publicado junto, cai pro mesmo arquivo
    // na internet, na mesma versão, pra ninguém ficar sem leitor.
    promessaLeitor = fetch(ARQUIVO_LEITOR, { method: "HEAD" })
      .then(function (r) { return r.ok ? ARQUIVO_LEITOR : LEITOR_CDN; })
      .catch(function () { return LEITOR_CDN; })
      .then(function (url) {
        return BarcodeDetectionAPI.prepareZXingModule({
          overrides: {
            locateFile: function (caminho, prefixo) {
              return /\.wasm$/.test(caminho) ? url : prefixo + caminho;
            }
          },
          fireImmediately: true
        });
      });
    // Se falhar, esquece a tentativa pra o botão "tentar de novo" poder
    // recomeçar do zero em vez de repetir o mesmo erro pra sempre.
    promessaLeitor.catch(function () { promessaLeitor = null; });
    return promessaLeitor;
  }

  function iniciarLoopLeitura() {
    var detector = new BarcodeDetector();
    var ocupado = false;
    var ultimaTentativa = 0;
    // O leitor nativo é barato e pode tentar a cada quadro. O de reserva roda
    // em WebAssembly e leva algumas dezenas de milissegundos por leitura —
    // sem esse respiro, as tentativas se empilhariam e o celular esquentaria
    // à toa sem ler mais rápido por isso.
    var intervalo = LEITOR_NATIVO ? 0 : 120;
    function tick() {
      if (!streamAtual) return;
      var v = document.getElementById("video");
      var agora = Date.now();
      if (!v || ocupado || agora - ultimaTentativa < intervalo) { requestAnimationFrame(tick); return; }
      ocupado = true;
      ultimaTentativa = agora;
      detector.detect(v).then(function (codes) {
        if (codes.length > 0) processarCodigoLido(codes[0].rawValue);
      }).catch(function () {}).then(function () {
        ocupado = false;
        requestAnimationFrame(tick);
      });
    }
    tick();
  }

  function prepararLeitorEComecar() {
    if (!LEITOR_NATIVO) { state.statusLeitor = "carregando"; state.erroLeitor = ""; render(); }
    prepararLeitor().then(function () {
      if (!streamAtual) return;
      state.statusLeitor = "pronto";
      state.erroLeitor = "";
      render();
      iniciarLoopLeitura();
    }).catch(function (e) {
      state.statusLeitor = "erro";
      // Mensagem sem tecniquês: quem está no galpão precisa saber o que
      // fazer, não o que o motor de leitura respondeu.
      state.erroLeitor = "n\u00e3o consegui preparar o leitor de c\u00f3digo deste aparelho \u2014 parece falta de internet. D\u00e1 pra separar marcando na m\u00e3o na aba \"Hoje\" enquanto isso.";
      render();
    });
  }

  function iniciarCamera() {
    // Mesma ideia da câmera em lote: solta qualquer câmera presa antes de
    // pedir esta, pra não disputar o hardware com uma câmera que ficou aberta.
    if (streamLote) pararCameraLote();
    // Toque de verdade do usuário: é a hora certa de destravar o áudio do
    // bipe (ver prepararAudioBipe).
    prepararAudioBipe();
    state.statusCamera = "pedindo"; state.erroCamera = ""; state.resultadoScan = null; render();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.statusCamera = "erro"; state.erroCamera = "esse navegador não expõe acesso à câmera aqui."; render(); return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (stream) {
      // Pedir a câmera leva alguns décimos de segundo. Se nesse meio-tempo a
      // pessoa já trocou de aba (ou abriu a câmera de foto), a câmera que
      // chegou agora não tem mais tela nenhuma pra mostrar: sem isso ela
      // ficava LIGADA em segundo plano, gastando bateria, com o laço de
      // leitura girando à toa procurando um <video> que não existe mais.
      if (state.aba !== "escanear" || state.loteFoto) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        // Volta pro botão "iniciar câmera" em vez de deixar "pedindo acesso"
        // congelado na tela pra quando a pessoa voltar.
        state.statusCamera = "idle";
        render();
        return;
      }
      streamAtual = stream;
      state.statusCamera = ("BarcodeDetector" in window) ? "ativa" : "sem-suporte";
      render();
      var video = document.getElementById("video");
      if (video) {
        video.srcObject = stream;
        video.play().catch(function () {});
      }
      if (!("BarcodeDetector" in window)) return;
      prepararLeitorEComecar();
    }).catch(function (e) {
      state.statusCamera = "erro";
      if (e.name === "NotReadableError") {
        state.erroCamera = "a c\u00e2mera parece estar em uso por outro app ou aba. Feche outros apps que usem c\u00e2mera (ou feche e abra o navegador de novo) e tente de novo. Detalhe t\u00e9cnico: " + e.message;
      } else if (e.name === "NotFoundError" || e.name === "OverconstrainedError") {
        state.erroCamera = "n\u00e3o encontrei nenhuma c\u00e2mera dispon\u00edvel nesse aparelho. Detalhe t\u00e9cnico: " + e.message;
      } else {
        state.erroCamera = "permiss\u00e3o negada ou bloqueada pelo ambiente. Detalhe t\u00e9cnico: " + e.message;
      }
      render();
    });
  }

  // Overlay simples por cima da tela atual (não substitui o app.innerHTML
  // inteiro como o loteFoto) — assim fechar não mexe no scroll da lista por
  // baixo.
  function renderVisualizadorFoto() {
    if (!state.fotoVisualizando) return "";
    var urls = state.fotoVisualizando.urls || [];
    // Pacote com mais de 1 foto (ex: pacote + fachada da loja específica)
    // mostra as duas empilhadas, com rolagem se precisar — "Apagar" some
    // com todas de uma vez (ver comentário em apagarFotoPacote).
    var imgs = urls.map(function (u) {
      return '<img src="' + u + '" style="max-width:100%;max-height:' + (urls.length > 1 ? "38vh" : "70vh") + ';border-radius:8px;object-fit:contain" />';
    }).join("");
    return '<div style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px">' +
      '<div style="display:flex;flex-direction:column;gap:10px;max-height:78vh;overflow-y:auto;align-items:center">' + imgs + '</div>' +
      '<div style="display:flex;gap:10px">' +
      '<button data-action="fechar-foto-visualizando" class="pill" style="background:#fff;color:#000">Fechar</button>' +
      '<button data-action="apagar-foto-visualizando" class="pill" style="background:var(--alert);color:#fff">\u{1F5D1}️ Apagar ' + (urls.length > 1 ? "as " + urls.length + " fotos" : "foto") + '</button>' +
      "</div></div>";
  }

  // ---------- render ----------
  function setAba(a) {
    if (state.aba !== a) {
      if (streamAtual) pararCamera();
      state.resultadoScan = null;
      state.flashScan = null;
      // Sair e voltar pra aba da câmera devolve o botão "iniciar câmera" em
      // vez de manter a caixa de erro da tentativa anterior na tela.
      if (state.statusCamera === "erro" || state.statusCamera === "sem-suporte") {
        state.statusCamera = "idle";
        state.erroCamera = "";
      }
      if (flashTimeoutId) { clearTimeout(flashTimeoutId); flashTimeoutId = null; }
    }
    state.aba = a;
    render();
  }

  // Guarda o campo que está sendo digitado ANTES de refazer a tela: o
  // innerHTML destrói o <input> focado, e com ele o texto que a pessoa estava
  // digitando e a posição do cursor. Sem isso, qualquer novidade da nuvem
  // (uma foto do colega, o contador global subindo) apagava o que estava
  // sendo escrito e fechava o teclado no meio.
  function guardarFoco(app) {
    var ativo = document.activeElement;
    if (!ativo || (ativo.tagName !== "INPUT" && ativo.tagName !== "TEXTAREA") || !app.contains(ativo)) return null;
    return {
      id: ativo.id || null,
      acao: ativo.getAttribute("data-action"),
      idAlvo: ativo.getAttribute("data-id"),
      rua: ativo.getAttribute("data-rua"),
      numero: ativo.getAttribute("data-numero"),
      valor: ativo.value,
      inicio: ativo.selectionStart,
      fim: ativo.selectionEnd
    };
  }
  function restaurarFoco(app, focoSalvo) {
    if (!focoSalvo) return;
    var alvo = null;
    if (focoSalvo.id) alvo = document.getElementById(focoSalvo.id);
    if (!alvo && focoSalvo.acao) {
      var sel = '[data-action="' + focoSalvo.acao + '"]';
      if (focoSalvo.idAlvo) sel += '[data-id="' + focoSalvo.idAlvo + '"]';
      else if (focoSalvo.rua != null && focoSalvo.numero != null) sel += '[data-rua="' + focoSalvo.rua + '"][data-numero="' + focoSalvo.numero + '"]';
      try { alvo = app.querySelector(sel); } catch (e) { alvo = null; }
    }
    if (!alvo) return;
    // O que a pessoa digitou manda: se o valor remontado veio diferente
    // (dado da nuvem chegando no meio da digitação), o texto dela volta.
    if (alvo.value !== focoSalvo.valor) alvo.value = focoSalvo.valor;
    alvo.focus();
    try { alvo.setSelectionRange(focoSalvo.inicio, focoSalvo.fim); } catch (e) { /* input que não aceita seleção */ }
  }

  function render() {
    var app = document.getElementById("app");

    if (state.loteFoto) {
      // Esta tela também é refeita inteira por qualquer novidade da nuvem
      // (foto do colega subindo, contador global andando) e tem campo de
      // texto dentro — então precisa da MESMA proteção do caminho normal,
      // senão o nome de quem recebeu some no meio da digitação e o teclado
      // fecha. Antes esse "return" pulava a restauração lá de baixo.
      var focoLote = guardarFoco(app);
      app.innerHTML = renderLoteFoto();
      attachHandlersLote();
      restaurarFoco(app, focoLote);
      var vLote = document.getElementById("videoLote");
      if (vLote && streamLote && vLote.srcObject !== streamLote) {
        vLote.srcObject = streamLote;
        vLote.play().catch(function () {});
      }
      return;
    }

    var html = "";

    var contadorAtivo = !!state.rotaConectada;
    html += '<header><div class="titlerow"><span style="font-size:22px">\u{1F4E6}</span><h1>Simplificando as Entregas</h1></div>' +
      '<p style="font-size:12px;opacity:.6;margin:2px 0 0">' + formatarNumero(state.contadorGlobal || 0) + " \u00b7 " +
      (contadorAtivo ? "Todos os pacotes processados no galp\u00e3o" : "Pacotes processados neste aparelho") +
      "</p>" +
      // Sem sinal: dizer isso no topo, onde a pessoa olha, em vez de deixar
      // ela achar que o colega est\u00e1 vendo o trabalho dela.
      (state.rotaConectada && state.conexaoViva === false
        ? '<p style="font-size:12px;margin:4px 0 0;color:var(--alert);font-weight:600">\u26a0\ufe0f sem sinal agora \u2014 o trabalho fica guardado aqui e sobe sozinho quando voltar</p>' : "") +
      (state.filaPendente.length > 0 ? '<p style="font-size:12px;margin:4px 0 0;color:var(--accent-deep);font-weight:600">\u23f3 ' + state.filaPendente.length + " " + plural(state.filaPendente.length, "foto pendente de envio", "fotos pendentes de envio") + "</p>" : "") +
      (state.avisoEnvio ? '<p style="font-size:12px;margin:4px 0 0;color:var(--alert);font-weight:600">' + esc(state.avisoEnvio) + "</p>" : "") +
      // Armazenamento cheio é silencioso por natureza (o navegador só recusa
      // de volta), então precisa gritar aqui em cima: o que está em risco é
      // comprovante de entrega e o progresso do dia.
      (state.avisoArmazenamento ? '<p style="font-size:12px;margin:6px 0 0;color:var(--alert);font-weight:700;line-height:1.4">⚠️ ' + esc(state.avisoArmazenamento) + "</p>" : "") +
      "</header>";

    html += '<div class="tabs">' +
      tabBtn("escanear", "\u{1F4F7} C\u00e2mera") +
      tabBtn("separar", "\u{1F4E6} Hoje") + tabBtn("mapa", "\u{1F4CD} Faixas") + '</div>';

    if (state.aba === "separar" && state.linhasParseadas) {
      html += '<button class="btn-primary" data-action="limpar-sessao" style="background:transparent;border:1px solid var(--line);color:var(--ink);opacity:.7;margin:10px 0 14px">\u21bb Limpar e come\u00e7ar novo dia</button>';
    }

    // Se alguma coisa inesperada estourar montando a lista, a tela ANTIGA
    // ficava congelada e nem mensagem aparecia — o app parecia morto e não
    // tinha nem como apertar "Limpar". Agora o erro é contido: mostra o que
    // aconteceu e um botão pra recomeçar, em vez de travar calado.
    try {
      if (state.aba === "escanear") html += renderCamera();
      else if (state.aba === "separar") html += renderSeparar();
      else if (state.aba === "mapa") html += renderMapa();
    } catch (e) {
      html += '<div class="warn-box" style="margin:14px 0"><p style="margin:0 0 8px;font-weight:600">Não consegui montar esta tela.</p>' +
        '<p style="margin:0 0 10px;font-size:13px">Costuma ser alguma linha fora do padrão na lista de hoje. As outras abas continuam funcionando.</p>' +
        '<p style="margin:0 0 10px;font-size:11px;font-family:ui-monospace,monospace;opacity:.7">' + esc(String(e && e.message ? e.message : e)) + '</p>' +
        '<button class="btn-primary" data-action="limpar-sessao">↻ Limpar e começar novo dia</button></div>';
    }

    // Guarda o campo que está sendo digitado ANTES de refazer a tela: o
    // innerHTML abaixo destrói o <input> focado, e com ele o texto que a
    // pessoa estava digitando e a posição do cursor. Sem isso, qualquer
    // novidade da nuvem (uma foto do colega, o contador global subindo)
    // apagava o que estava sendo escrito e fechava o teclado no meio.
    var focoSalvo = guardarFoco(app);

    html += renderVisualizadorFoto();

    app.innerHTML = html;

    attachHandlers();

    restaurarFoco(app, focoSalvo);
    if (state.aba === "escanear" && streamAtual) {
      var v2 = document.getElementById("video");
      if (v2 && v2.srcObject !== streamAtual) {
        v2.srcObject = streamAtual;
        v2.play().catch(function () {});
      }
    }

    // Volta o scroll pro pacote/endereço onde a foto foi tirada, em vez de
    // deixar a lista voltar pro topo (só usa uma vez e descarta — ver
    // comentário perto de "definirFoco").
    if (focoAncora) {
      var idFoco = focoAncora;
      focoAncora = null;
      salvar("foco-ancora", null);
      var elFoco = document.getElementById(idFoco);
      if (elFoco) elFoco.scrollIntoView({ block: "center" });
    }
  }

  function tabBtn(id, label) {
    return '<button class="tab' + (state.aba === id ? " active" : "") + '" data-tab="' + id + '">' + label + "</button>";
  }

  function renderLoteFoto() {
    var lote = state.loteFoto;
    var ehFachada = lote.tipo === "fachada";
    var chaveLote = ehFachada ? "" : chaveOrdenavel(lote.ruaNome, lote.numero);
    var lojaPorLojaLote = !ehFachada && lote.itens.length > 1 && enderecoEhIndividual(chaveLote, lote.itens);
    var quemRecebeuLote = "";
    for (var qi = 0; qi < lote.itens.length; qi++) {
      var qv = (state.entregaInfo[lote.itens[qi].id] && state.entregaInfo[lote.itens[qi].id].quemRecebeu) || "";
      if (qv) { quemRecebeuLote = qv; break; }
    }
    var itensComFoto = ehFachada ? 0 : lote.itens.filter(function (_, idx) {
      return lote.fotos.some(function (f) { return f.itemIdx === idx; });
    }).length;
    // Modo "foto extra" (pacote que já tinha sido enviado antes, e alguém
    // esqueceu uma foto na hora): mostra quantas ele JÁ tinha salvas, pra não
    // parecer que a contagem voltou do zero.
    var jaTinhaExtra = (!ehFachada && lote.modoExtra) ? fotosDoPacote(lote.itens[0].id).length : 0;
    var infoLinha = ehFachada
      ? (lote.fotos.length > 0 ? "foto pronta pra enviar" : "tire 1 foto da fachada do prédio")
      : lote.modoExtra
      ? ("já tem " + jaTinhaExtra + " " + plural(jaTinhaExtra, "foto salva", "fotos salvas") + " · essa é pra somar, não substitui")
      : (itensComFoto + '/' + lote.itens.length + ' pacotes com foto · ' + lote.fotos.length + ' ' + plural(lote.fotos.length, "foto tirada", "fotos tiradas"));
    var html = '<div style="padding:24px 0">';
    html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px">' +
      '<div><p style="font-weight:700;font-size:15px;margin:0">' + esc(lote.ruaNome) + ' · nº ' + esc(lote.numero) +
      (ehFachada ? " · fachada" : (lote.modoExtra ? " · " + esc(nomeItemLote(lote.itens[0], 0)) : "")) + '</p>' +
      '<p style="font-size:12px;opacity:.65;margin:2px 0 0">' + infoLinha + '</p></div>' +
      '<button data-action="cancelar-lote" style="border:none;background:none;font-size:22px;color:var(--ink);opacity:.6;cursor:pointer;flex-shrink:0">✕</button></div>';

    if (!ehFachada && lote.itens.length > 1) {
      // Dá pra virar a chave aqui dentro também: normalmente é na hora de
      // fotografar que se percebe que aquele número é shopping.
      html += '<button data-action="alternar-individual-lote" data-chave="' + chaveLote + '" class="pill' + (lojaPorLojaLote ? " ativo-entregue" : "") + '" style="margin-bottom:10px">' +
        (lojaPorLojaLote ? "\ud83c\udfea Loja por loja" : "\ud83c\udfe2 Um nome pra todos") + "</button>";
    }
    if (!ehFachada && !lojaPorLojaLote) {
      // Prédio: um nome só (o porteiro) vale pro número inteiro — ninguém
      // confere nome por nome na portaria. Fachada não pergunta isso.
      // data-action/data-rua/data-numero não são decoração: é por eles que o
      // callback do Firebase reconhece que ESTE campo está sendo digitado e
      // não pode ser trocado pelo valor que veio da nuvem (ver
      // callbackEntregasAtual). Sem isso o nome sumia no meio da digitação.
      html += '<input id="quemRecebeuLoteInput" data-action="quem-recebeu-lote" data-rua="' + esc(lote.ruaNome) + '" data-numero="' + esc(lote.numero) + '" value="' + esc(quemRecebeuLote) + '" placeholder="Quem recebeu esse lote? (ex: porteiro)" style="width:100%;font-size:13px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light);margin-bottom:12px;box-sizing:border-box" />';
    }

    if (lote.statusCamera === "pedindo") {
      html += '<p class="muted" style="text-align:center;padding:16px 0">pedindo acesso à câmera...</p>';
    } else if (lote.statusCamera === "erro") {
      html += '<div class="warn-box">' + esc(lote.erro) + '</div>' +
        '<button data-action="reativar-camera-lote" class="btn-primary" style="margin-top:8px">Tentar de novo</button>';
    } else if (lote.statusCamera === "idle") {
      html += '<div class="warn-box">câmera pausada (o app ficou em segundo plano).</div>' +
        '<button data-action="reativar-camera-lote" class="btn-primary" style="margin-top:8px">▶️ Reativar câmera</button>';
    }

    html += '<video id="videoLote" playsinline autoplay muted style="display:' + (lote.statusCamera === "ativa" ? "block" : "none") + '"></video>';

    if (lote.statusCamera === "ativa") {
      if (ehFachada) {
        // Fachada é só 1 foto — depois de tirada, o obturador some (pra ver
        // de novo é só apagar a miniatura, que ele volta).
        if (lote.fotos.length === 0) {
          html += '<button data-action="tirar-foto-lote" class="btn-primary" style="margin-top:12px;font-size:16px;padding:16px">📸 Tirar foto da fachada</button>';
        }
      } else if (lote.modoExtra) {
        // Só 1 pacote nesse lote e ele já tinha foto — não faz sentido usar
        // os rótulos "foto do pacote"/"frente da loja" (que pressupõem uma
        // sequência do zero). Um botão só, que vira "mais uma" depois da
        // primeira, pro raro caso de faltar mais de uma foto.
        if (!lote.fotos.length) {
          html += '<button data-action="tirar-foto-lote" class="btn-primary" style="margin-top:12px;font-size:16px;padding:15px 16px;text-align:left">📷 Tirar a foto que faltou</button>';
        } else {
          var qtdNovaExtra = fotosDoItemLote(lote, 0);
          html += '<button data-action="tirar-foto-extra-lote" class="btn-primary" style="margin-top:8px;font-size:15px;padding:14px 16px;text-align:left;background:var(--accent-deep)">📷 Mais uma foto' +
            '<span style="display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:3px">essa sessão já tem ' + qtdNovaExtra + ' ' + plural(qtdNovaExtra, "foto nova", "fotos novas") + '</span></button>';
        }
      } else {
        var proxIdx = proximoItemIdxLote(lote);
        var ultimoIdx = ultimoItemIdxLote(lote);
        // Botão de cima = foto do PACOTE do próximo nome da lista. Ele fica
        // sempre no mesmo lugar pra prédio comum continuar sendo "toca, toca,
        // toca" (1 foto por pacote, sem toque a mais).
        if (proxIdx !== null) {
          html += '<button data-action="tirar-foto-lote" class="btn-primary" style="margin-top:12px;font-size:16px;padding:15px 16px;text-align:left">📦 Foto do pacote \u00b7 ' +
            esc(cortarNome(nomeItemLote(lote.itens[proxIdx], proxIdx), 26)) +
            '<span style="display:block;font-size:11px;font-weight:400;opacity:.75;margin-top:3px">' + (proxIdx + 1) + ' de ' + lote.itens.length + ' desse número</span></button>';
        }
        // Botão de baixo = a 2ª foto do MESMO nome que acabou de ser
        // fotografado (a frente da loja dele, no caso de shopping). É o par
        // que o Sérgio pediu: foto do pacote seguida da foto da loja, nome
        // por nome. Só aparece depois que já existe a foto do pacote.
        if (ultimoIdx !== null) {
          var qtdUlt = fotosDoItemLote(lote, ultimoIdx);
          var nomeUlt = esc(cortarNome(nomeItemLote(lote.itens[ultimoIdx], ultimoIdx), 26));
          html += '<button data-action="tirar-foto-extra-lote" class="btn-primary" style="margin-top:8px;font-size:15px;padding:14px 16px;text-align:left;background:var(--accent-deep)">🏪 ' +
            (qtdUlt === 1 ? 'Frente da loja \u00b7 ' : 'Mais uma foto \u00b7 ') + nomeUlt +
            '<span style="display:block;font-size:11px;font-weight:400;opacity:.85;margin-top:3px">' +
            (qtdUlt === 1 ? 'mesma pessoa da foto anterior \u2014 fica com 2 fotos' : 'esse nome já está com ' + qtdUlt + ' fotos') +
            '</span></button>';
        }
      }
    }

    // Conferência rápida por NOME: quem desse número já está com foto e
    // quantas. Num shopping é isso que diz "a loja do Bruno já tá com as 2".
    if (!ehFachada && lote.itens.length > 1) {
      html += '<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">';
      lote.itens.forEach(function (linha, idx) {
        var n = fotosDoItemLote(lote, idx);
        html += '<div style="padding:' + (lojaPorLojaLote ? "6px 0 10px" : "3px 0") + ';opacity:' + (n ? "1" : ".55") + '">' +
          '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (idx + 1) + '. ' + esc(nomeItemLote(linha, idx)) + '</span>' +
          '<span style="flex-shrink:0;font-weight:700;color:' + (n >= 2 ? "var(--ok)" : "var(--ink)") + '">' + (n ? "\ud83d\udcf7 " + n : "sem foto") + '</span></div>' +
          // Num shopping, quem assina é a pessoa daquela loja: o campo fica
          // junto do nome dela, aqui mesmo na câmera, pra preencher na hora
          // da entrega sem ter que voltar pra lista.
          (lojaPorLojaLote
            ? '<input data-action="quem-recebeu-lote-item" data-id="' + linha.id + '" value="' + esc((state.entregaInfo[linha.id] && state.entregaInfo[linha.id].quemRecebeu) || "") + '" placeholder="Quem recebeu nessa loja" style="width:100%;box-sizing:border-box;margin-top:5px;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink);background:var(--paper-light)" />'
            : "") +
          '</div>';
      });
      html += '</div>';
    }

    if (lote.fotos.length > 0) {
      html += '<div style="display:flex;gap:8px;overflow-x:auto;padding:14px 0">';
      lote.fotos.forEach(function (f, idx) {
        var pacoteDaFoto = ehFachada ? null : lote.itens[f.itemIdx];
        var ehExtra = !ehFachada && lote.fotos.slice(0, idx).some(function (x) { return x.itemIdx === f.itemIdx; });
        // Agora a legenda mostra o NOME (num shopping, o nome é a loja) e se
        // aquela foto é a do pacote ou a da frente da loja. No modo "foto
        // extra" não dá pra saber se é a foto do pacote ou da loja (o
        // pacote já tinha foto de antes, essa é só "mais uma") — por isso
        // aqui a legenda fica genérica em vez de arriscar rótulo errado.
        var legenda = ehFachada ? "fachada" : lote.modoExtra ? "nova" : (pacoteDaFoto ? (cortarNome(nomeItemLote(pacoteDaFoto, f.itemIdx), 14) + " · " + (ehExtra ? "loja" : "pacote")) : "extra");
        html += '<div style="position:relative;flex-shrink:0;text-align:center">' +
          '<img src="' + f.previewUrl + '" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block" />' +
          '<button data-action="remover-foto-lote" data-idx="' + idx + '" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--alert);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">✕</button>' +
          '<p style="font-size:9px;opacity:.6;margin:3px 0 0;width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(legenda) + '</p></div>';
      });
      html += '</div>';
    }

    html += '<button data-action="enviar-lote" class="btn-primary" style="margin-top:8px"' + (lote.fotos.length === 0 ? " disabled" : "") + '>' +
      '✅ ' + (ehFachada ? "Enviar foto da fachada" : "Enviar " + lote.fotos.length + " " + plural(lote.fotos.length, "foto", "fotos")) + '</button>';
    html += '</div>';
    return html;
  }

  function attachHandlersLote() {
    var app = document.getElementById("app");
    var quemRecebeuLoteInput = document.getElementById("quemRecebeuLoteInput");
    if (quemRecebeuLoteInput && state.loteFoto) {
      var loteRuaNome = state.loteFoto.ruaNome, loteNumero = state.loteFoto.numero;
      quemRecebeuLoteInput.oninput = function () { aplicarQuemRecebeuEndereco(loteRuaNome, loteNumero, quemRecebeuLoteInput.value, false); };
      quemRecebeuLoteInput.onblur = function () { aplicarQuemRecebeuEndereco(loteRuaNome, loteNumero, quemRecebeuLoteInput.value, true); };
    }
    app.querySelectorAll('[data-action="quem-recebeu-lote-item"]').forEach(function (el) {
      var id = el.getAttribute("data-id");
      el.oninput = function () {
        if (!state.entregaInfo[id]) state.entregaInfo[id] = {};
        state.entregaInfo[id].quemRecebeu = el.value;
      };
      el.onblur = function () { salvarQuemRecebeu(id, el.value); };
    });
    var alternarLoteBtn = app.querySelector('[data-action="alternar-individual-lote"]');
    if (alternarLoteBtn && state.loteFoto) {
      var loteRua = state.loteFoto.ruaNome, loteNum = state.loteFoto.numero;
      alternarLoteBtn.onclick = function () {
        alternarEnderecoIndividual(alternarLoteBtn.getAttribute("data-chave"), loteRua, loteNum);
      };
    }
    var cancelarBtn = app.querySelector('[data-action="cancelar-lote"]');
    if (cancelarBtn) cancelarBtn.onclick = cancelarLoteFoto;
    var reativarBtn = app.querySelector('[data-action="reativar-camera-lote"]');
    if (reativarBtn) reativarBtn.onclick = iniciarCameraLote;
    var tirarBtn = app.querySelector('[data-action="tirar-foto-lote"]');
    if (tirarBtn) tirarBtn.onclick = function () { tirarFotoLote("novo"); };
    var tirarExtraBtn = app.querySelector('[data-action="tirar-foto-extra-lote"]');
    if (tirarExtraBtn) tirarExtraBtn.onclick = function () { tirarFotoLote("extra"); };
    var enviarBtn = app.querySelector('[data-action="enviar-lote"]');
    if (enviarBtn) enviarBtn.onclick = enviarLoteFoto;
    app.querySelectorAll('[data-action="remover-foto-lote"]').forEach(function (el) {
      el.onclick = function () { removerFotoLote(parseInt(el.getAttribute("data-idx"), 10)); };
    });
  }

  function renderFlashScan() {
    if (!state.flashScan) return "";
    var f = state.flashScan;
    var corTexto = corTextoParaHex(f.cor);
    return '<div style="position:fixed;inset:0;background:' + f.cor + ';z-index:1200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none">' +
      '<p style="font-size:60px;font-weight:800;margin:0;color:' + corTexto + '">' + f.label + '</p>' +
      '<p style="font-size:20px;font-weight:600;margin:0;color:' + corTexto + ';opacity:.9">' + esc(f.rua) + ' · nº ' + esc(f.numero) + '</p>' +
      "</div>";
  }

  function renderCamera() {
    if (!state.linhasParseadas) {
      return '<div class="warn-box">Carregue a lista do dia na aba "Hoje" primeiro \u2014 \u00e9 dela que vem o n\u00famero de cada pacote.</div>';
    }
    var html = '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">' +
      '<button data-action="alternar-bipe" class="pill' + (state.bipeAtivo ? " ativo-entregue" : "") + '">' +
      (state.bipeAtivo ? "\ud83d\udd0a Bipe ligado" : "\ud83d\udd07 Bipe desligado") + '</button></div>';
    if (state.statusCamera === "idle") {

      // barra de endere\u00e7o pra recarregar. A c\u00e2mera de foto j\u00e1 tinha esse

      html += '<div class="warn-box">' + esc(state.erroCamera) + "</div>" +

    if (state.resultadoScan) {

      } else if (r.encontrado) {

  function renderResumoBar(resultado) {

        // Uma vez com foto confirmada, o \u00edcone vira "ver a foto" em vez de

        var botaoFoto;
        if (jaTemFoto) {
          // "+" abre a c\u00e2mera s\u00f3 pra somar uma foto a mais (ex: esqueceu a
          // frente da loja e s\u00f3 foi lembrar depois de j\u00e1 ter ido embora) \u2014

          botaoFoto = '<button data-action="ver-foto-pacote" data-id="' + item.id + '" class="pill ativo-entregue">\u2713 Foto' + (qtdFotosPacote > 1 ? " (" + qtdFotosPacote + ")" : "") + '</button>' +

  }


  // ===================== Importar JSON da API do J&T =====================
  // A J&T não libera PDF nem planilha da lista do dia, e a leitura de texto
  // (print/vídeo de tela, Google Lens) sempre teve risco de erro — a rota real
  // de dados é interceptar o próprio app J&T Outfield com um proxy (fora
  // desta ferramenta) e colar aqui a resposta JSON do endpoint que devolve a
  // lista completa do dia. É o dado que o servidor da J&T manda de verdade,
  // sem nenhuma leitura visual envolvida, então não erra dígito nem letra.
  var IMPJ_TIPO = "(?:rua|avenida|av\\.?|travessa|trav\\.?|estrada|alameda|al\\.?|pra[cç]a|largo|rodovia)";
  var IMPJ_JUNK = { "icarai": 1, "icaraí": 1, ".": 1, "": 1, "nao informado": 1, "não informado": 1 };
  // "apto 902", "loja 106", "sala 105": um número colado a uma dessas
  // palavras nunca é o número da casa — é complemento. Serve tanto pra tirar
  // esse número da disputa por "qual é o número de verdade" quanto pra
  // guardar o próprio complemento (a loja/apto) e mostrar pro entregador.
  var IMPJ_COMPL = "(?:apt?o?|apart(?:amento)?|casa|cs|loja|lj|bloco|bl|sala|sl|andar|and|quadra|qd|lote|lt|fundos|sobrado)";

  function impjLimparRua(s) {
    if (!s) return "";
    s = s.replace(/-?\s*lado\s*[íi]mpar/gi, "");
    s = s.replace(/-?\s*lado\s*par/gi, "");
    s = s.replace(/\s*-?\s*de\s*\d+\s*(?:a|ao)\s*(?:\d+\s*(?:fim)?|fim)\b/gi, "");
    s = s.replace(/\s*-?\s*at[ée]\s*\d+/gi, "");
    s = s.replace(/\s*-\s*trade\s*center.*$/gi, "");
    s = s.replace(/^\s*icara[ií];?\s*/gi, "");
    s = s.replace(/\(cpf.*?\)/gi, "");
    s = s.replace(/\s+/g, " ").trim();
    return s.replace(/^[\s;,.\-]+|[\s;,.\-]+$/g, "");
  }
  // Tira o mesmo ruído de faixa/lado que impjLimparRua tira do nome da rua,
  // mas de um texto qualquer (o detalhe do endereço) — sem cortar fora do
  // padrão "rua" nem exigir prefixo de tipo de logradouro.
  function impjLimparRuido(s) {
    if (!s) return "";
    s = s.replace(/-?\s*lado\s*[íi]mpar/gi, " ");
    s = s.replace(/-?\s*lado\s*par/gi, " ");
    s = s.replace(/\s*-?\s*de\s*\d+\s*(?:a|ao)\s*(?:\d+\s*(?:fim)?|fim)\b/gi, " ");
    s = s.replace(/\s*-?\s*at[ée]\s*\d+/gi, " ");
    return s;
  }
  function impjRuaValida(s) {
    var s2 = impjLimparRua(s);
    if (!s2) return false;
    if (IMPJ_JUNK[s2.toLowerCase()]) return false;
    if (s2.length < 4) return false;
    if (/^\s*(?:apto|ap\.?|bloco|bl\.?)\b/i.test(s2)) return false;
    return true;
  }
  function impjNumeroValido(s) {
    if (!s) return null;
    s = s.trim();
    var m = s.match(/^(\d{1,5}[A-Za-z]?)$/);
    if (!m) return null;
    if (m[1].replace(/^0+/, "") === "") return null;
    return m[1];
  }
  function impjPrefixoRua(s) {
    s = impjLimparRua(s);
    if (!s) return s;
    if (!new RegExp("^" + IMPJ_TIPO + "\\b", "i").test(s)) s = "Rua " + s;
    return s;
  }
  function impjNormalizarNumero(n) {
    if (!n) return n;
    var m = n.match(/^0*(\d+)([A-Za-z]?)$/);
    if (!m) return n;
    return (m[1] || "0") + m[2];
  }

  // Lista, em ordem, cada número de 1 a 5 dígitos de um texto, marcando se
  // veio colado a uma palavra de complemento (apto/loja/sala/...) — esses
  // nunca competem pra ser o número da casa.
  function impjNumerosComContexto(s) {
    var out = [], re = new RegExp("(\\b" + IMPJ_COMPL + "\\.?\\s*n?[º°]?\\s*)?(\\d{1,5})\\b", "gi"), m;
    while ((m = re.exec(s || "")) !== null) out.push({ valor: m[2], comKeyword: !!m[1] });
    return out;
  }

  // Uma rua às vezes vem com o número do apartamento colado na frente do
  // número da casa (ex: streetNum = "701", mas o endereço de verdade é "413"
  // — 701 é o apartamento). Sem saber até onde a rua vai, não dá pra saber
  // qual dos dois é o de verdade. Com o "até que número" cadastrado em
  // Faixas pro lado par/ímpar dessa rua, dá: se o número escolhido estourar
  // esse teto, procura nos outros campos brutos um número que caiba — se
  // achar exatamente um, é esse o número de casa de verdade.
  function impjCorrigirPorFaixa(oficial, numeroAtual, textoLivre) {
    if (!oficial || !numeroAtual) return null;
    var n = parseInt(numeroAtual, 10);
    if (isNaN(n)) return null;
    var maxDele = (n % 2 === 0) ? oficial.maxPar : oficial.maxImpar;
    if (!maxDele || n <= maxDele) return null;

    var limpo = impjLimparRuido(textoLivre || "");
    var vistos = {}, candidatos = [];
    impjNumerosComContexto(limpo).forEach(function (c) {
      if (c.comKeyword) return;
      if (c.valor === numeroAtual) return;
      if (!vistos[c.valor]) { vistos[c.valor] = 1; candidatos.push(c.valor); }
    });
    var validos = candidatos.filter(function (v) {
      var nv = parseInt(v, 10);
      var maxV = (nv % 2 === 0) ? oficial.maxPar : oficial.maxImpar;
      return maxV && nv <= maxV;
    });
    if (validos.length === 1) return { numero: validos[0] };
    return { numero: null };
  }

  // O que sobra do endereço depois de tirar o nome da rua e o número
  // escolhido costuma ser exatamente o que ajuda o entregador a achar o
  // pacote de verdade — loja, sala, apto, ou o nome do comércio ("Cafeteria",
  // "Portaria"). Guarda esse resto pra mostrar entre parênteses na lista.
  var IMPJ_COMPL_JUNK = { "undefined": 1, "null": 1, "n/a": 1, "na": 1, "nan": 1, "-": 1, "--": 1 };

  function impjExtrairComplemento(r) {
    var det = impjLimparRuido(r.detRaw || "");
    var ruaLimpa = impjLimparRua(r.ruaRaw || "");
    if (ruaLimpa) {
      var alvo = normalizar(det);
      var pos = alvo.indexOf(normalizar(ruaLimpa));
      if (pos !== -1) det = det.slice(0, pos) + det.slice(pos + ruaLimpa.length);
    }
    if (r.numero) det = det.replace(new RegExp("\\b" + r.numero + "\\b", "g"), " ");
    det = det.replace(/[;,]+/g, " · ");
    det = det.replace(/^[\s·.\-]+|[\s·.\-]+$/g, "").replace(/\s+/g, " ").trim();
    // sobrou só pontuação, um pedaço curto demais, ou lixo conhecido do
    // próprio sistema da J&T (campo vazio virou a palavra "undefined")
    var chave = det.replace(/[^\wÀ-ÿ]/g, "");
    if (chave.length < 2 || IMPJ_COMPL_JUNK[det.toLowerCase()] || IMPJ_JUNK[normalizar(det)]) return "";
    // sobrou só o nome da rua repetido (o texto bruto tinha o endereço
    // duplicado) — isso não é complemento nenhum, é só ruído
    var ruaSemTipo = (r.rua || "").replace(new RegExp("^" + IMPJ_TIPO + "\\s+", "i"), "");
    if (normalizar(det) === normalizar(r.rua || "") || normalizar(det) === normalizar(ruaSemTipo)) return "";
    // muito comprido costuma ser o endereço inteiro repetido por engano —
    // melhor não mostrar nada do que mostrar lixo grande
    if (det.length > 60) return "";
    return det;
  }

  // Extrai rua+número de UM pacote do JSON, tentando várias estratégias na
  // ordem — o endereço da J&T vem consistente na maior parte, mas com um bom
  // tanto de bagunça: campo de rua com o bairro em vez da rua, formato com
  // ";", número escondido no fim ou no início do campo de detalhe, etc.
  function impjExtrairRegistro(p) {
    var nome = p.receiverName || "";
    var ruaRaw = (p.receiverStreet || "").trim();
    var numRaw = (p.receiverStreetNum || "").trim();
    var det = (p.receiverDetailedAddress || "").trim();

    function reg(rua, numero, metodo) {
      return {
        nome: nome, rua: rua, numero: numero, metodo: metodo,
        ruaRaw: p.receiverStreet, streetnumRaw: p.receiverStreetNum, detRaw: p.receiverDetailedAddress
      };
    }

    // campos trocados: rua_raw é só bairro, mas o detalhe traz a rua de
    // verdade e o número já vem certo no campo de número
    if (!impjRuaValida(ruaRaw)) {
      var nSwap = impjNumeroValido(numRaw);
      var mSwap = det.match(new RegExp("^\\s*(" + IMPJ_TIPO + "[^\\d,]*)\\s*$", "i"));
      if (nSwap && mSwap) return reg(impjPrefixoRua(mSwap[1]), nSwap, "campos-trocados");
    }

    // formato "Bairro;Rua;Número+complemento"
    var alvoPv = ruaRaw.indexOf(";") !== -1 ? ruaRaw : (det.indexOf(";") !== -1 ? det : "");
    if (alvoPv.indexOf(";") !== -1) {
      var partes = alvoPv.split(";").map(function (x) { return x.trim(); }).filter(Boolean);
      var ruaCand = null, resto = null, tipoRe = new RegExp("\\b" + IMPJ_TIPO + "\\b", "i");
      for (var i = 0; i < partes.length; i++) {
        if (tipoRe.test(partes[i])) { ruaCand = partes[i]; resto = partes[i + 1] || ""; break; }
      }
      if (!ruaCand && partes.length >= 2) { ruaCand = partes[partes.length - 2]; resto = partes[partes.length - 1]; }
      if (ruaCand) {
        var mpv = (resto || "").match(/^\s*(\d{1,5}[A-Za-z]?)/);
        if (mpv && impjRuaValida(ruaCand)) return reg(impjPrefixoRua(ruaCand), mpv[1], "pv");
      }
    }

    if (!impjRuaValida(ruaRaw)) {
      var mdt = det.match(new RegExp("^\\s*(" + IMPJ_TIPO + "[^,]*?)[,\\s]+(\\d{1,5}[A-Za-z]?)\\b", "i"));
      if (mdt) return reg(impjPrefixoRua(mdt[1]), mdt[2], "det-tem-rua");
      return reg(null, null, "falhou");
    }

    var n = impjNumeroValido(numRaw);
    if (n) return reg(impjPrefixoRua(ruaRaw), n, "streetnum");

    // o campo de rua às vezes vem com o nome de um comércio colado depois do
    // número ("Rua Guilherme Geenhalch 16 Lanchonete..."), e o detalhe traz só
    // esse mesmo número sozinho — nesse caso a rua de verdade é só o pedaço
    // antes do número.
    var detSoNum = det.match(/^(\d{1,5}[A-Za-z]?)$/);
    if (detSoNum) {
      var posNum = ruaRaw.search(new RegExp("\\b" + detSoNum[1] + "\\b"));
      if (posNum > 0) {
        var ruaCortada = ruaRaw.slice(0, posNum);
        if (impjRuaValida(ruaCortada)) return reg(impjPrefixoRua(ruaCortada), detSoNum[1], "rua-com-lixo");
      }
    }

    var mnum = (ruaRaw + " " + det).match(/n[uú]mero:?\s*(\d{1,5}[A-Za-z]?)/i);
    if (mnum) return reg(impjPrefixoRua(ruaRaw.replace(/n[uú]mero:?\s*\d{1,5}[A-Za-z]?/gi, "")), mnum[1], "numero:");

    var m2 = ruaRaw.match(new RegExp("^(" + IMPJ_TIPO + "[^,]*?)[,\\s]+(\\d{1,5}[A-Za-z]?)\\s*$", "i"));
    if (m2) return reg(impjPrefixoRua(m2[1]), m2[2], "rua+num");

    var m3 = det.match(/^\s*(\d{1,5}[A-Za-z]?)\b/);
    if (m3) return reg(impjPrefixoRua(ruaRaw), m3[1], "det-inicio");

    var m4 = det.match(/(\d{1,5}[A-Za-z]?)\s*$/);
    if (m4) return reg(impjPrefixoRua(ruaRaw), m4[1], "det-fim");

    var m5 = det.match(new RegExp("^(" + IMPJ_TIPO + "[^,]*?)[,\\s]+(\\d{1,5}[A-Za-z]?)\\b", "i"));
    if (m5) return reg(impjPrefixoRua(m5[1]), m5[2], "det-completo");

    return reg(null, null, "falhou");
  }

  // Recebe o array "data" do JSON (um pacote por item) e devolve a lista
  // pronta pro texto de "Organizar pacotes", junto com um resumo pra avisar
  // o Sérgio do que aconteceu (pedidos com várias peças, marcados como
  // "abnormal" pela própria J&T, e qualquer endereço que não deu pra ler).
  function impjProcessarPacotes(dados) {
    // pedidos com mais de uma peça repetem o mesmo pacote: um registro "base"
    // (código de 15 dígitos) e um por peça física ("-001", "-002", ...). O
    // base é sempre um espelho do grupo — descarta, ou o pacote conta em
    // dobro na lista.
    var porBase = {};
    dados.forEach(function (p) {
      var base = (p.waybillNo || "").split("-")[0];
      (porBase[base] = porBase[base] || []).push(p);
    });
    var finais = [], removidosBase = 0;
    Object.keys(porBase).forEach(function (base) {
      var regs = porBase[base];
      if (regs.length === 1) { finais.push(regs[0]); return; }
      var comSufixo = regs.filter(function (r) { return (r.waybillNo || "").indexOf("-") !== -1; });
      var semSufixo = regs.filter(function (r) { return (r.waybillNo || "").indexOf("-") === -1; });
      finais = finais.concat(comSufixo.length ? comSufixo : regs);
      removidosBase += comSufixo.length ? semSufixo.length : 0;
    });

    var registros = finais.map(function (p) {
      var r = impjExtrairRegistro(p);
      r.codigo = p.waybillNo;
      r.abnormal = !!p.isAbnormal;
      return r;
    });

    // núcleos de rua já resolvidos nesta mesma lista, usados como âncora pros
    // poucos endereços que nenhuma das estratégias acima decifrou sozinha
    var nucleos = [];
    registros.forEach(function (r) {
      if (!r.rua) return;
      var nuc = r.rua.replace(new RegExp("^" + IMPJ_TIPO + "\\s+", "i"), "").trim();
      if (nuc.length >= 6 && nucleos.indexOf(nuc) === -1) nucleos.push(nuc);
    });
    nucleos.sort(function (a, b) { return b.length - a.length; });
    registros.forEach(function (r) {
      if (r.rua && r.numero) return;
      var alvo = normalizar(r.detRaw || "");
      for (var i = 0; i < nucleos.length; i++) {
        var nu = nucleos[i], nuS = normalizar(nu);
        if (alvo.indexOf(nuS) !== 0) continue;
        var resto = (r.detRaw || "").slice(nu.length).trim();
        var m = resto.match(/^\s*(\d{1,5}[A-Za-z]?)/);
        if (m) { r.rua = impjPrefixoRua(nu); r.numero = m[1]; r.metodo = "ancorado-nucleo"; }
        break;
      }
    });

    // encaixa cada rua na sua já cadastrada em Faixas (mesma correspondência
    // usada pra corrigir nome de rua torto) — assim o nome final sai igual ao
    // que o Sérgio já registrou, e o pacote ganha cor sem precisar de nada a
    // mais dele. De quebra, com a rua oficial em mãos dá pra saber até que
    // número esse lado dela vai (quando cadastrado) e corrigir um número que
    // na verdade é complemento colado na frente.
    registros.forEach(function (r) {
      if (!r.rua) return;
      var oficial = encontrarRuaMapeada(r.rua, state.mapaRuas);
      if (oficial) r.rua = oficial.nome;
      r.numero = impjNormalizarNumero(r.numero);

      var textoLivre = [r.ruaRaw, r.streetnumRaw, r.detRaw].filter(Boolean).join(" ");
      if (oficial && r.numero) {
        var corr = impjCorrigirPorFaixa(oficial, r.numero, textoLivre);
        if (corr) {
          if (corr.numero) { r.numero = corr.numero; r.metodo += "+corrigido-faixa"; }
          else { r.foraDaFaixa = true; }
        }
      }
      r.complemento = impjExtrairComplemento(r);
    });

    var completos = registros.filter(function (r) { return r.rua && r.numero; });
    var falhas = registros.filter(function (r) { return !(r.rua && r.numero); });

    completos.sort(function (a, b) {
      return a.rua === b.rua ? (parseInt(a.numero, 10) - parseInt(b.numero, 10)) : a.rua.localeCompare(b.rua);
    });
    var texto = completos.map(function (r) {
      var nome = (r.nome || "").replace(/\s+/g, " ").trim();
      var notas = [];
      if (r.complemento) notas.push(r.complemento);
      if (r.foraDaFaixa) notas.push("conferir número — fora da faixa cadastrada");
      if (notas.length) nome += " (" + notas.join(" · ") + ")";
      return r.rua + ", " + r.numero + ", " + nome + ", " + r.codigo;
    }).join("\n");

    var porBaseFinal = {};
    completos.forEach(function (r) {
      var b = r.codigo.split("-")[0];
      (porBaseFinal[b] = porBaseFinal[b] || []).push(r);
    });
    var gruposMultiPeca = Object.keys(porBaseFinal).filter(function (b) { return porBaseFinal[b].length > 1; })
      .map(function (b) { return porBaseFinal[b]; });

    return {
      texto: texto, total: completos.length, removidosBase: removidosBase,
      falhas: falhas, gruposMultiPeca: gruposMultiPeca,
      abnormais: completos.filter(function (r) { return r.abnormal; }),
      corrigidosPorFaixa: completos.filter(function (r) { return r.metodo.indexOf("+corrigido-faixa") !== -1; }),
      foraDaFaixa: completos.filter(function (r) { return r.foraDaFaixa; })
    };
  }

  function impjSalvarRascunho() {
    salvar("json-import-rascunho", state.jsonImport.rascunho);
  }

  function renderImportarJson() {
    var J = state.jsonImport, html = "";
    html += '<div style="display:flex;align-items:center;gap:10px;margin:4px 0 12px">' +
      '<button data-action="json-fechar" style="border:none;background:none;font-size:22px;color:var(--ink);opacity:.6;cursor:pointer;padding:0">✕</button>' +

    html += '<div class="card" style="padding:12px;font-size:12px;line-height:1.5;margin-bottom:12px">' +

      '<p style="margin:2px 0">O corpo (JSON) da chamada <code>awaitDelivery/all</code> — pode colar com ou sem o <code>{"code":1,...,"data":[...]}</code> em volta, tanto faz.</p>' +
      '<p style="margin:6px 0 0;color:var(--accent-deep);font-weight:600">É o dado que o servidor da J&amp;T manda de verdade — sem leitura de tela, sem erro de OCR.</p></div>';

    html += '<textarea id="jsonTexto" class="card" rows="8" placeholder="Cole aqui o JSON" style="width:100%;font-size:12px;font-family:ui-monospace,monospace;padding:10px;margin-bottom:10px;color:var(--ink)">' + esc(J.rascunho || "") + '</textarea>';
    html += '<button class="btn-primary" data-action="json-gerar"' + (!J.rascunho || !J.rascunho.trim() ? " disabled" : "") + '>Gerar lista</button>';
    return html;
  }

  function impjGerarLista() {
    var bruto = (state.jsonImport.rascunho || "").trim();
    if (!bruto) return;
    var obj;
    try { obj = JSON.parse(bruto); }
    catch (e) { alert("Isso não é um JSON válido. Confira se copiou o corpo da resposta inteiro, sem cortar o começo nem o fim."); return; }
    var dados = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.data) ? obj.data : null);
    if (!dados) { alert("Não achei uma lista de pacotes nesse JSON (esperava um array em \"data\")."); return; }
    if (!dados.length) { alert("O JSON não tem nenhum pacote dentro."); return; }

    var r = impjProcessarPacotes(dados);
    if (!r.total) { alert("Nenhum pacote saiu com endereço completo. Confira se colou o JSON certo."); return; }

    var avisos = [];
    if (r.falhas.length) avisos.push(r.falhas.length + " pacote(s) não deu pra ler o endereço — ficaram de fora: " + r.falhas.map(function (f) { return f.codigo; }).join(", "));
    if (r.gruposMultiPeca.length) {
      avisos.push(r.gruposMultiPeca.length + " pedido(s) com mais de uma peça (código com sufixo -001, -002...): " +
        r.gruposMultiPeca.map(function (g) { return g[0].nome + " (" + g.length + " peças, " + g[0].rua + " " + g[0].numero + ")"; }).join(" · "));
    }
    if (r.abnormais.length) avisos.push(r.abnormais.length + " pacote(s) vieram marcados como \"abnormal\" pela própria J&T — fica o alerta, nenhum foi tirado da lista.");
    if (r.corrigidosPorFaixa.length) {
      avisos.push(r.corrigidosPorFaixa.length + " número(s) vieram com complemento colado na frente e foram corrigidos com base na faixa cadastrada: " +
        r.corrigidosPorFaixa.map(function (f) { return f.nome + " (" + f.rua + " " + f.numero + ")"; }).join(" · "));
    }
    if (r.foraDaFaixa.length) {
      avisos.push("ATENÇÃO: " + r.foraDaFaixa.length + " pacote(s) com número fora da faixa cadastrada e sem um número alternativo claro no endereço — confira antes de sair: " +
        r.foraDaFaixa.map(function (f) { return f.nome + " (" + f.rua + " " + f.numero + ", " + f.codigo + ")"; }).join(" · "));
    }
    if (r.removidosBase) avisos.push("(" + r.removidosBase + " registro(s) duplicado(s) de pedidos com peças foram descartados sem afetar a contagem.)");

    state.textoColado = r.texto;
    state.jsonImport.aberto = false;
    state.jsonImport.rascunho = "";
    impjSalvarRascunho();
    render();
    alert("Lista pronta com " + r.total + " pacotes." + (avisos.length ? "\n\n" + avisos.join("\n\n") : ""));
  }

        (state.enviandoFila ? "Reenviando..." : "⏳ " + state.filaPendente.length + " " + plural(state.filaPendente.length, "foto pendente", "fotos pendentes") + " — tentar agora") +
        "</button>";
    }

    if (cloudinaryPronto && state.minhaRota) {
      html += '<button data-action="baixar-zip" class="btn-primary" style="margin-bottom:12px"' + (state.baixandoZip ? " disabled" : "") + ">" +
        (state.baixandoZip && !state.baixandoZipChave ? "Preparando o zip..." : "\u{1F4E5} Baixar fotos de hoje (zip, em ordem)") + "</button>";
    }

    if (resultado.naoMapeadas.length > 0) {
      html += '<div class="warn-box" style="margin-bottom:12px"><strong>ruas ainda sem faixa:</strong> ' + resultado.naoMapeadas.map(esc).join(", ") +
        ' \u2014 esses pacotes est\u00e3o nas caixas cinza no fim da lista (contam normal). Cadastre na aba "Faixas" pra eles ganharem cor.</div>';
    }

    if (resultado.erros.length > 0) {
      html += '<details class="muted" style="margin-bottom:12px;font-size:12px"><summary style="cursor:pointer">' + resultado.erros.length + " " + plural(resultado.erros.length, "linha n\u00e3o reconhecida", "linhas n\u00e3o reconhecidas") + "</summary><ul style='margin-top:4px;padding-left:18px'>" +
        resultado.erros.map(function (e) { return "<li style='font-family:ui-monospace,monospace'>" + esc(e.raw) + "</li>"; }).join("") + "</ul></details>";
    }

    if (resultado.duplicados.length > 0) {
      html += '<details class="warn-box" style="margin-bottom:12px;font-size:12px"><summary style="cursor:pointer;font-weight:600">' + resultado.duplicados.length + " " + plural(resultado.duplicados.length, "c\u00f3digo repetido", "c\u00f3digos repetidos") + " na lista \u2014 pode ser a causa do contador n\u00e3o subir ao escanear</summary><ul style='margin-top:4px;padding-left:18px'>" +
        resultado.duplicados.map(function (d) { return "<li style='font-family:ui-monospace,monospace'>" + esc(d.codigo) + " \u2014 aparece " + d.vezes + " vezes</li>"; }).join("") + "</ul></details>";
    }

    html += renderListaGrupos(resultado);
    return html;
  }

        : state.mapaRuas.length === 0
        ? "assim que cadastrar uma rua abaixo, ela j\u00e1 sobe pra nuvem sozinha"
        : "\u2713 Faixas com c\u00f3pia de seguran\u00e7a na nuvem") + "</p>" +
      (state.minhaRota
        ? '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">' +
          (fbDb ? '<button data-action="restaurar-faixas-nuvem" class="pill"' + (state.restaurandoFaixas ? " disabled" : "") + '>' + (state.restaurandoFaixas ? "Buscando..." : "\u2601 Restaurar da nuvem") + "</button>" : "") +
