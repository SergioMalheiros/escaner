<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1B2620" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Simplificando as Entregas" />
<style>
  :root {
    --ink: #1B2620;
    --paper: #EAE6D6;
    --paper-light: #F5F2E7;
    --paper-deep: #DDD8C2;
    --accent: #DB9A34;
    --accent-deep: #8F5B14;
    --line: #CBC5AA;
    --ok: #4C7A5E;
    --alert: #AA4530;
    --alert-light: #F1DCD4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 420px; margin: 0 auto; padding: 0 16px 64px; }
  header { padding: 32px 0 20px; }
  header .titlerow { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  header h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .tabs { display: flex; border-radius: 10px; padding: 4px; background: var(--paper-deep); margin-bottom: 20px; gap: 2px; }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 4px; border-radius: 7px; font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--ink); opacity: .6; cursor: pointer; font-family: inherit; }
  .tab.active { background: var(--ink); color: var(--paper-light); opacity: 1; }
  .card { border-radius: 10px; background: var(--paper-light); border: 1px solid var(--line); }
  .muted { opacity: .75; }
  .btn-primary { width: 100%; padding: 13px; border-radius: 10px; font-weight: 600; font-size: 14px; border: none; background: var(--ink); color: var(--paper-light); cursor: pointer; font-family: inherit; }
  .btn-primary:disabled { opacity: .4; }
  input, textarea, select { font-family: inherit; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .result-color { border-radius: 14px; padding: 28px 20px; text-align: center; }
  .result-warn { border-radius: 14px; padding: 16px; text-align: center; font-size: 14px; background: var(--alert-light); color: var(--alert); }
  .checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .checkbox.done { background: var(--ok); border-color: var(--ok); }
  .nome-separado { color: var(--ok); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  video { width: 100%; min-height: 240px; object-fit: cover; border-radius: 10px; background: #000; margin-top: 12px; }
  .warn-box { border-radius: 10px; padding: 12px; font-size: 13px; background: var(--alert-light); color: var(--alert); }
  .colorpick-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 13px; }
  .swatch { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); padding: 0; cursor: pointer; }
  .swatch-mini { width: 30px; height: 30px; border-radius: 8px; padding: 0; cursor: pointer; }
  .pill { font-size: 11px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper-light); color: var(--ink); cursor: pointer; font-family: inherit; font-weight: 600; }
  .pill.ativo-entregue { background: var(--ok); border-color: var(--ok); color: var(--paper-light); }
  .pill.ativo-devolvido { background: var(--alert); border-color: var(--alert); color: var(--paper-light); }
  .pill.ativo-pendente { background: var(--accent); border-color: var(--accent); color: var(--ink); }
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;background:#1B2620;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s ease">
  <svg width="88" height="88" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#F5F2E7" stroke-width="32" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 98.5 186 L 256 98.5 L 413.5 186 L 413.5 361 L 256 448.5 L 98.5 361 Z"/>
      <path d="M 98.5 186 L 256 273.5 L 413.5 186"/>
      <path d="M 256 273.5 L 256 448.5"/>
    </g>
  </svg>
  <p style="margin:0;color:#F5F2E7;font-size:19px;font-weight:700;text-align:center;padding:0 24px">Simplificando as Entregas</p>
</div>
<script>
  // Tela de abertura: some sozinha depois de 1,5s, só pra dar um respiro de
  // marca antes de cair direto na lista/câmera. Não interfere no resto do
  // app — é um elemento por cima, o #app renderiza normalmente por baixo
  // enquanto ela ainda está visível.
  setTimeout(function () {
    var splash = document.getElementById("splash");
    if (!splash) return;
    splash.style.opacity = "0";
    setTimeout(function () { splash.remove(); }, 400);
  }, 1500);
</script>
<div id="app"></div>

<script>
  // Marca ANTES de qualquer polyfill se este navegador já tem leitor de
  // código próprio. No Chrome do Android tem (rápido, do sistema); no Safari
  // do iPhone não tem — e como no iPhone todo navegador é Safari por baixo,
  // trocar de navegador lá não adianta. Quem não tem, usa o leitor extra
  // logo abaixo.
  window.LEITOR_NATIVO = ("BarcodeDetector" in window);
</script>
<!-- Leitor de código de reserva (só entra em ação onde o navegador não tem o
     próprio): barcode-detector 3.2.2 sobre zxing-wasm 3.1.3, ambos MIT.
     Ele só se instala se window.BarcodeDetector ainda não existir, então em

<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
(function () {
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyAcDi0XGCVu1-NUW82rklsrjHLXgxdbss4",
    authDomain: "simplificando-as-entregas.firebaseapp.com",
    databaseURL: "https://simplificando-as-entregas-default-rtdb.firebaseio.com",
    projectId: "simplificando-as-entregas",
    storageBucket: "simplificando-as-entregas.firebasestorage.app",
    messagingSenderId: "807848505946",
    appId: "1:807848505946:web:fcf700c76f8a32f1b49e63"
  };
  var fbDb = null;
  try {
    if (window.firebase && firebase.initializeApp) {
      firebase.initializeApp(firebaseConfig);
      fbDb = firebase.database();
    }
  } catch (e) {
    fbDb = null;
  }

  // ---------- Cloudinary (armazenamento das fotos) ----------
  // Preencha com os dados da sua conta Cloudinary (Settings > Upload > Upload presets,
  // crie um preset com Signing Mode = Unsigned). Enquanto estiver com os valores de
  // exemplo abaixo, o app roda normal, só as fotos ficam desativadas.
  var CLOUDINARY_CLOUD_NAME = "debey3jdv";
  var CLOUDINARY_UPLOAD_PRESET = "Simplificando as Entregas";
  var cloudinaryPronto = !!(
    CLOUDINARY_CLOUD_NAME && CLOUDINARY_UPLOAD_PRESET &&
    CLOUDINARY_CLOUD_NAME.indexOf("COLE_AQUI") === -1 &&
    CLOUDINARY_UPLOAD_PRESET.indexOf("COLE_AQUI") === -1
  );
  function sanitizarChaveFirebase(s) {
    // Duas pessoas digitando "o mesmo" código de rota nem sempre digitam
    // exatamente igual (maiúscula/minúscula, espaço a mais ou a menos) — isso
    // fazia cada aparelho cair num caminho diferente no Firebase e parecer
    // que nada sincronizou. Por isso a CHAVE usada lá dentro é sempre
    // normalizada (maiúsculas, espaços únicos, sem sobra nas pontas), mesmo
    // que o campo na tela continue mostrando o código do jeito que a pessoa
    // digitou.
    return (s || "")
      .trim()
      .replace(/\s+/g, " ")
      .toUpperCase()
      .replace(/[.#$\[\]\/]/g, "-");
  }
  function dataDeHoje() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function diasEntre(dataStr1, dataStr2) {
    var a = new Date(dataStr1 + "T00:00:00");
    var b = new Date(dataStr2 + "T00:00:00");
    return Math.round((b - a) / 86400000);
  }
  function chaveOrdenavel(ruaNome, numero) {
    var n = parseInt(numero, 10);
    var numPad = isNaN(n) ? "999999" : String(n).padStart(6, "0");
    var ruaChave = normalizar(ruaNome).replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    // O sufixo preserva o que vem DEPOIS do número (a letra do "120A", o
    // "S/N" inteiro). Sem ele, 120 e 120A viravam o mesmo endereço: a foto
    // de fachada de um aparecia como se fosse do outro, o botão "Baixar" de
    // um baixava a pasta do outro, e o modo "loja por loja" ligava nos dois
    // juntos. O número continua no começo da chave, então a ordenação da
    // lista (que é o motivo da chave existir) não muda.
    var resto = normalizar(String(numero == null ? "" : numero)).replace(/[^a-z0-9]+/g, "");
    var sufixo = isNaN(n) ? resto : resto.replace(String(n), "");
    return ruaChave + "_" + numPad + (sufixo ? "-" + sufixo : "");
  }
  function comprimirImagem(file, maxLado, qualidade) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.width, h = img.height;
        if (w >= h && w > maxLado) { h = Math.round((h * maxLado) / w); w = maxLado; }
        else if (h > w && h > maxLado) { w = Math.round((w * maxLado) / h); h = maxLado; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (blob) resolve(blob); else reject(new Error("falha ao comprimir"));
        }, "image/jpeg", qualidade || 0.7);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("falha ao carregar imagem")); };
      img.src = url;
    });
  }

  function blobParaBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onloadend = function () { resolve(reader.result); };
      reader.onerror = function () { reject(new Error("falha ao converter foto pra guardar offline")); };
      reader.readAsDataURL(blob);
    });
  }
  function base64ParaBlob(dataUrl) {
    var partes = dataUrl.split(",");
    var mimeMatch = partes[0].match(/data:([^;]+);base64/);
    var mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
    var bin = atob(partes[1]);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  // Sufixo único no nome (ver os "nomeArquivo" montados na hora de enviar): o preset
  // do Cloudinary está com "Overwrite: false", então reenviar pro mesmo
  // public_id (ex: tirar a foto de novo do mesmo pacote) NÃO substituiria a
  // imagem antiga — o Cloudinary só devolveria a antiga de novo, calado, como
  // se tivesse dado certo. Com timestamp no nome, cada envio vira um arquivo
  // realmente novo, e o app sempre usa a URL do envio mais recente (é essa
  // URL que fica salva no Firebase).
  function subirParaCloudinary(blob, pasta, nomeArquivo) {
    var formData = new FormData();
    formData.append("file", blob, nomeArquivo + ".jpg");
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("folder", pasta);
    formData.append("public_id", nomeArquivo);

    return fetch("https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/image/upload", {
      method: "POST",
      body: formData
    }).catch(function () {
      var erroRede = new Error("sem conexão com o Cloudinary agora");
      erroRede.semConexao = true;
      throw erroRede;
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (texto) {
          var erro = new Error("Cloudinary respondeu " + resp.status + ": " + texto);
          erro.respostaInvalida = true;
          throw erro;
        });
      }
      return resp.json();
    }).then(function (dados) {
      return dados.secure_url;
    });
  }

  // ---------- fila de fotos pendentes (offline) ----------
  function idFila() { return "F" + Date.now() + "-" + Math.random().toString(36).slice(2, 8); }
  // A fila inteira continua SEMPRE na memória (é ela que manda os reenvios).
  // O que é limitado aqui é só a cópia guardada no armazenamento do celular,
  // que é o que sobrevive se o Android descartar a aba. Guarda as mais
  // ANTIGAS primeiro — são as que já falharam mais vezes e correm mais risco
  // — e avisa na tela quando alguma foto ficou só na memória, porque nesse
  // ponto ela é um comprovante de entrega que pode se perder.
  function salvarFila() {
    // Guarda o MÁXIMO de fotos que couber. Tenta a fila inteira primeiro (é o
    // caso normal e é uma gravação só); se o armazenamento recusar, vai
    // cortando pela metade até achar quanto cabe — sempre mantendo as mais
    // ANTIGAS, que são as que já falharam mais vezes e correm mais risco.
    var alvo = Math.min(state.filaPendente.length, filaMaxGuardada);
    var guardou = -1;
    var n = alvo;
    while (n > 0) {
      if (salvar("fila-fotos-pendentes", state.filaPendente.slice(0, n))) { guardou = n; break; }
      n = Math.floor(n / 2);
    }
    if (guardou === -1) {
      // Nem uma foto coube: grava lista vazia pra não deixar uma versão velha
      // e enganosa da fila no armazenamento.
      salvar("fila-fotos-pendentes", []);
      guardou = 0;
    } else if (guardou < alvo) {
      // Cortar pela metade acha rápido um tamanho que cabe, mas costuma
      // deixar espaço sobrando — e cada foto a mais guardada é um
      // comprovante a menos correndo risco. Então sobe de volta procurando
      // o maior que ainda cabe.
      var baixo = guardou, alto = alvo;
      while (alto - baixo > 1) {
        var meio = Math.floor((baixo + alto) / 2);
        if (salvar("fila-fotos-pendentes", state.filaPendente.slice(0, meio))) baixo = meio;
        else alto = meio;
      }
      // Quando um setItem falha ele não escreve nada, então o que ficou
      // guardado é sempre a última tentativa que deu certo — ou seja, "baixo".
      guardou = baixo;
    }
    avisarFotosSoNaMemoria(state.filaPendente.length - guardou);
  }
  function avisarFotosSoNaMemoria(sobraram) {
    state.avisoArmazenamento = sobraram > 0
      ? sobraram + " foto(s) pendente(s) estão só na memória porque o armazenamento do celular encheu. Envie as pendentes agora — se o app for fechado antes, essas fotos se perdem."
      : "";
  }
  function removerDaFilaPorIdentidade(item) {
    state.filaPendente = state.filaPendente.filter(function (p) {
      if (p.tipo !== item.tipo) return true;
      // Pacote agora pode ter mais de uma foto (mais de 1 "slot") — a
      // identidade pra descartar uma tentativa antiga da fila tem que
      // considerar o slot também, senão a foto extra (slot 1) que falhou
      // apagaria da fila a foto principal (slot 0) que também tava esperando
      // reenvio, perdendo ela pra sempre.
      return item.tipo === "pacote" ? (p.linhaId !== item.linhaId || p.slotIdx !== item.slotIdx) : p.chave !== item.chave;
    });
  }
  function pacotePendenteFila(linhaId) {
    return state.filaPendente.some(function (p) { return p.tipo === "pacote" && p.linhaId === linhaId; });
  }
  function fachadaPendenteFila(chave) {
    return state.filaPendente.some(function (p) { return p.tipo === "fachada" && p.chave === chave; });
  }

  // Um pacote pode ter mais de 1 foto agora (ex: loja específica dentro de um
  // shopping, além da foto do próprio pacote) — fica guardado como um mapa
  // "slot -> url" (slot 0, 1, 2...) tanto localmente quanto no Firebase, pra
  // cada foto poder ser enviada de forma independente sem uma sobrescrever a
  // outra. Esses dois helpers escondem esse detalhe do resto do código.
  function fotosDoPacote(linhaId) {
    var info = state.entregaInfo[linhaId];
    if (!info || !info.fotos) return [];
    return Object.keys(info.fotos).sort(function (a, b) { return (+a) - (+b); }).map(function (k) { return info.fotos[k]; });
  }
  function temFotoPacote(linhaId) {
    return fotosDoPacote(linhaId).length > 0;
  }
  // Próximo slot livre pra uma NOVA foto desse pacote — precisa contar tanto
  // as já confirmadas (fotosDoPacote, vindas do Firebase) quanto as que ainda
  // estão só na fila de reenvio (internet caiu bem na hora de enviar): sem
  // isso, adicionar uma foto extra enquanto a anterior ainda não confirmou
  // podia calcular o mesmo slot pras duas e uma sobrescrever a outra quando
  // as duas finalmente chegassem no Firebase.
  function proximoSlotPacote(linhaId) {
    var maior = fotosDoPacote(linhaId).length;
    state.filaPendente.forEach(function (p) {
      if (p.tipo === "pacote" && p.linhaId === linhaId && typeof p.slotIdx === "number") {
        maior = Math.max(maior, p.slotIdx + 1);
      }
    });
    return maior;
  }

  // DEVOLVE UMA PROMESSA de propósito: quem chama só pode considerar a foto
  // "entregue" (e tirar ela da fila) depois que o Firebase CONFIRMAR a
  // gravação. Antes isso era "mande e esqueça": o Cloudinary aceitava a foto,
  // o item saía da fila na hora, e se o celular matasse o app antes do
  // Firebase gravar (comum com a câmera aberta e sinal ruim), a foto ficava
  // no Cloudinary sem nenhum registro apontando pra ela — não entrava no zip
  // e não aparecia na tela. Ou seja: comprovante de entrega perdido.
  function gravarFotoNoFirebase(item, url) {
    if (item.tipo === "pacote") {
      var quemRecebeu = (state.entregaInfo[item.linhaId] && state.entregaInfo[item.linhaId].quemRecebeu) || item.quemRecebeuSnapshot || "";
      // "fotos/<slot>" como chave do update() grava só essa foto específica,
      // sem mexer nas outras fotos desse mesmo pacote — importante porque
      // pacotes com mais de 1 foto (pacote + fachada da loja, por exemplo)
      // enviam cada foto de forma independente, às vezes ao mesmo tempo.
      var campos = {
        rua: item.rua, numero: item.numero, nome: item.nome || "",
        chave: item.chave, ts: Date.now()
      };
      // Só grava "quem recebeu" quando tem alguma coisa pra gravar. Antes ele
      // ia sempre, inclusive vazio — e uma foto subindo logo depois do colega
      // digitar o nome apagava o nome dele.
      if (quemRecebeu) campos.quemRecebeu = quemRecebeu;
      campos["fotos/" + item.slotIdx] = url;
      return fbDb.ref("lotes/" + item.chaveRota + "/entregas/" + item.data + "/" + item.codigo).update(campos);
    } else if (item.tipo === "fachada") {
      // Sem data no caminho de propósito: a fachada de um prédio não muda de
      // um dia pro outro, então fica registrada pra sempre (por rota +
      // endereço) e é reaproveitada automaticamente quando a rota se repete.
      return fbDb.ref("lotes/" + item.chaveRota + "/fachadas_permanentes/" + item.chave).set({
        rua: item.rua, numero: item.numero, fotoFachadaUrl: url, ts: Date.now()
      });
    }
    return Promise.resolve();
  }

  // Guarda a foto na fila de reenvio. Extraído porque agora TODA falha cai
  // aqui — não só falta de conexão.
  function guardarNaFila(item, blob) {
    return blobParaBase64(blob).then(function (base64) {
      removerDaFilaPorIdentidade(item);
      item.id = idFila();
      item.blobBase64 = base64;
      item.criadoEm = Date.now();
      state.filaPendente.push(item);
      salvarFila();
      render();
    });
  }

  // Primeira tentativa de envio, logo depois de tirar a foto. Se falhar por
  // causa de conexão, guarda a foto (em base64) no localStorage pra tentar de
  // novo mais tarde, em vez de simplesmente perder ou travar o app.
  function processarEnvioFoto(item, blob) {
    // A foto entra na fila ANTES de tentar subir, e só sai de lá quando o
    // Firebase confirmar. Assim, qualquer coisa que dê errado no meio (app
    // fechado, celular sem bateria, sinal caindo bem na hora) deixa a foto
    // guardada pra reenviar, em vez de sumir. É a fila que garante que a foto
    // nunca se perde — e ela é o comprovante de entrega.
    guardarNaFila(item, blob).then(function () {
      return subirParaCloudinary(blob, item.pasta, item.nomeArquivo);
    }).then(function (url) {
      return gravarFotoNoFirebase(item, url);
    }).then(function () {
      // Confirmado dos dois lados: agora sim pode sair da fila.
      state.filaPendente = state.filaPendente.filter(function (p) { return p.id !== item.id; });
      salvarFila();
      render();
    }).catch(function (err) {
      // Fica na fila e tenta de novo depois (quando a conexão voltar, ao
      // reabrir o app, ou pelo botão "tentar agora"). Vale pra QUALQUER
      // falha, inclusive o Cloudinary recusando por limite de envios —
      // antes esse caso jogava a foto fora na hora, com um alerta.
      if (err && err.respostaInvalida) {
        state.avisoEnvio = "O Cloudinary recusou o envio agora (" + (err.message || "") .slice(0, 80) + "). A foto está guardada e vai ser reenviada — dá pra forçar no botão de pendentes.";
      }
      render();
    });
  }

  // Reenvia a fila pendente, um item de cada vez (mais confiável numa conexão
  // fraca do que mandar tudo junto). Chamada quando a conexão volta, quando o
  // app volta a ficar visível, no carregamento, e pelo botão manual.
  function tentarReenviarFila() {
    if (state.enviandoFila || !cloudinaryPronto || !fbDb) return;
    if (!state.filaPendente.length) return;
    state.enviandoFila = true;
    var pendentes = state.filaPendente.slice();

    function processarProximo(i) {
      if (i >= pendentes.length) {
        state.enviandoFila = false;
        render();
        return;
      }
      var item = pendentes[i];
      Promise.resolve().then(function () {
        return subirParaCloudinary(base64ParaBlob(item.blobBase64), item.pasta, item.nomeArquivo);
      }).then(function (url) {
        // Espera o Firebase CONFIRMAR antes de tirar da fila. Sem esse await,
        // uma gravação que ficasse só bufferizada (offline) sumia da fila
        // como se tivesse dado certo, e a foto ficava órfã no Cloudinary.
        return gravarFotoNoFirebase(item, url);
      }).then(function () {
        state.filaPendente = state.filaPendente.filter(function (p) { return p.id !== item.id; });
        salvarFila();
      }).catch(function () {
        // ainda sem conexão (ou erro passageiro) — deixa na fila, tenta o próximo
      }).then(function () {
        render();
        processarProximo(i + 1);
      });
    }
    processarProximo(0);
  }

  // Uma vez que o pacote já tem foto confirmada (ícone verde), clicar nele
  // mostra a foto em vez de abrir a câmera de novo — pra retirar é preciso
  // apagar primeiro (função separada), só então o ícone volta a abrir a
  // câmera pra uma foto nova.
  function verFotoPacote(linhaId) {
    var urls = fotosDoPacote(linhaId);
    if (!urls.length) return;
    state.fotoVisualizando = { tipo: "pacote", linhaId: linhaId, urls: urls };
    render();
  }

  // Mesmo visualizador do "✓ Foto" do pacote, só que pra fachada — dá pra ver
  // como a foto ficou antes de decidir se apaga pra tirar outra.
  function verFotoFachada(chave) {
    var url = state.fachadaInfo[chave];
    if (!url) return;
    state.fotoVisualizando = { tipo: "fachada", chave: chave, urls: [url] };
    render();
  }

  function fecharFotoVisualizando() {
    state.fotoVisualizando = null;
    render();
  }

  function apagarFotoPacote(linhaId) {
    var linha = state.linhasParseadas && state.linhasParseadas.find(function (l) { return l.id === linhaId; });
    if (!linha) return;
    var n = fotosDoPacote(linhaId).length;
    // Apaga todas as fotos desse pacote de uma vez (não uma por vez) — mais
    // simples de explicar e evita ficar com um "resto" de foto antiga de um
    // slot que ninguém foi conferir. Pra um pacote com 2 fotos (ex: loja
    // específica), é tirar as 2 de novo, rapidinho.
    if (!confirm(n > 1 ? "Apagar essas " + n + " fotos desse pacote? Depois dá pra tirar novas." : "Apagar essa foto? Depois dá pra tirar uma nova.")) return;
    if (state.entregaInfo[linhaId]) state.entregaInfo[linhaId].fotos = {};
    if (fbDb && state.minhaRota && linha.codigo) {
      var chaveRota = sanitizarChaveFirebase(state.minhaRota);
      fbDb.ref("lotes/" + chaveRota + "/entregas/" + dataDeHoje() + "/" + linha.codigo + "/fotos").remove();
    }
    render();
  }

  // "Esqueci de fotografar a frente da loja e só fui perceber depois de já
  // ter ido embora" — sem isso, a única forma de acrescentar a foto que
  // faltou era apagar TODAS as fotos daquele pacote (inclusive a que já
  // estava certa) e tirar tudo de novo, o que na prática significa voltar e
  // pedir o pacote de volta pra pessoa que recebeu — uma situação
  // constrangedora. Esse caminho abre a mesma câmera ao vivo de sempre, só
  // que fechada num único pacote, pra somar uma foto nova às que já foram
  // enviadas, sem mexer nelas.
  function abrirFotoExtraPacote(linhaId) {
    if (!state.linhasParseadas) return;
    var linha = state.linhasParseadas.find(function (l) { return l.id === linhaId; });
    if (!linha || !linha.codigo) return;
    definirFoco("pacote-" + linhaId);
    state.loteFoto = { tipo: "pacotes", modoExtra: true, ruaNome: linha.rua, numero: linha.numero, itens: [linha], fotos: [], statusCamera: "pedindo", erro: "" };
    render();
    iniciarCameraLote();
  }

  function abrirFachadaFoto(ruaNome, numero) {
    if (!cloudinaryPronto || !fbDb || !state.minhaRota) return;
    // Só chega aqui quando ainda NÃO tem fachada registrada (o botão vira
    // "ver/apagar" assim que existe uma — ver verFotoFachada/apagarFachada),
    // então pode abrir a câmera direto, sem precisar confirmar substituição.
    var chave = chaveOrdenavel(ruaNome, numero);
    // Mesma câmera ao vivo do "Todas"/"Foto" (sem input nativo) — só que sem
    // itens de pacote e sem pedir quem recebeu, já que fachada é só a foto
    // do prédio.
    definirFoco("endereco-" + chave);
    state.loteFoto = { tipo: "fachada", ruaNome: ruaNome, numero: numero, itens: [], fotos: [], statusCamera: "pedindo", erro: "" };
    render();
    iniciarCameraLote();
  }

  // Apaga a fachada permanente (some da rota inteira, não só de hoje) — a
  // pedido, no mesmo espírito do apagar de foto de pacote: precisa apagar
  // primeiro pra o botão voltar a abrir a câmera pra uma foto nova.
  function apagarFachada(chave) {
    if (!confirm("Apagar essa foto de fachada? Ela vale pra rota inteira (não só hoje), então some pra todo mundo que usa esse código de rota. Depois dá pra tirar uma nova.")) return;
    if (state.fachadaInfo[chave] !== undefined) delete state.fachadaInfo[chave];
    if (fbDb && state.minhaRota) {
      var chaveRota = sanitizarChaveFirebase(state.minhaRota);
      fbDb.ref("lotes/" + chaveRota + "/fachadas_permanentes/" + chave).remove();
    }
    render();
  }

  // ---------- câmera ao vivo por endereço (pacotes e fachada) ----------
  // Única forma de tirar foto no app — pacote(s) e fachada. Antes existia
  // também uma câmera nativa (sair pro app de câmera do celular e voltar),
  // com qualidade um pouco melhor, mas cada foto exigia sair e voltar do app
  // — e em vários aparelhos isso não reabria sozinho pro próximo pacote.
  // Essa aqui abre uma câmera ao vivo DENTRO do app (mesma técnica da aba de
  // escanear) com um obturador na tela: tira quantas quiser sem sair da
  // tela, revisa as miniaturas, e só envia quando aperta "Enviar" — bem mais
  // rápido e prático, principalmente pra prédios com vários pacotes. O
  // mesmo state.loteFoto serve tanto pra pacote(s) (tipo "pacotes", pede
  // quem recebeu) quanto pra fachada (tipo "fachada", 1 foto só, sem quem
  // recebeu).
  var streamLote = null;

  function pararCameraLote() {
    if (streamLote) { streamLote.getTracks().forEach(function (t) { t.stop(); }); streamLote = null; }
  }

  function abrirLoteFoto(ruaNome, numero) {
    if (!state.linhasParseadas) return;
    // Mesma regra que monta as caixas na tela (linhasDoEndereco): compara
    // pelo nome CANÔNICO quando a rua está cadastrada nas Faixas e pelo nome
    // cru quando ela ainda NÃO está (caixa cinza). Antes só considerava rua
    // cadastrada — resultado: em rua sem faixa, tocar em "Foto" não fazia
    // absolutamente nada, e não dava pra registrar a entrega daquele pacote.
    var todosDoNumero = linhasDoEndereco(ruaNome, numero);
    var itensDoNumero = todosDoNumero.filter(function (l) { return !!l.codigo; });
    // Sem código não dá pra guardar a foto (o código é o endereço dela no
    // Firebase e o nome do arquivo dentro do zip). Antes o botão simplesmente
    // não fazia nada quando a lista vinha sem a coluna de código — parecia
    // app quebrado. Agora explica o que fazer.
    if (!itensDoNumero.length && todosDoNumero.length) {
      alert("Esses pacotes vieram na lista sem o código de rastreio, e é ele que identifica a foto na hora de dar baixa.\n\nCole a lista com as 4 colunas (rua, número, nome, código) pra poder fotografar.");
      return;
    }
    var itens = itensDoNumero.filter(function (l) {
      if (pacotePendenteFila(l.id)) return false;
      // Endereço com só 1 pacote: precisa poder reabrir mesmo se já tiver
      // foto (retirar uma foto ruim, por exemplo). Com mais de 1 pacote,
      // qualquer botão "Foto" clicado abre o mesmo lote de quem ainda não
      // tem foto — igual ao "Todas" — só entra aqui quem ainda não tem foto
      // (senão ia obrigar a refazer todo mundo de novo).
      if (itensDoNumero.length === 1) return true;
      return !temFotoPacote(l.id);
    });
    if (!itens.length) {
      // Chega aqui quando as fotos desses pacotes ainda estão na fila
      // esperando internet: também era um botão mudo.
      if (itensDoNumero.some(function (l) { return pacotePendenteFila(l.id); })) {
        alert("A foto desse endereço já foi tirada e está guardada esperando internet pra subir.\n\nEla sobe sozinha quando o sinal voltar — dá pra forçar no aviso de pendentes lá em cima.");
      }
      return;
    }
    definirFoco("endereco-" + chaveOrdenavel(ruaNome, numero));
    state.loteFoto = { tipo: "pacotes", ruaNome: ruaNome, numero: numero, itens: itens, fotos: [], statusCamera: "pedindo", erro: "" };
    render();
    iniciarCameraLote();
  }

  function iniciarCameraLote() {
    if (!state.loteFoto) return;
    // Libera qualquer câmera que tenha ficado presa de uma tentativa anterior
    // (inclusive a do scanner, se por algum motivo ainda estiver aberta) antes
    // de pedir uma nova — pedir uma câmera com outra ainda ativa é uma causa
    // comum do navegador recusar o pedido.
    pararCameraLote();
    if (streamAtual) pararCamera();
    state.loteFoto.statusCamera = "pedindo";
    state.loteFoto.erro = "";
    render();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      state.loteFoto.statusCamera = "erro";
      state.loteFoto.erro = "esse navegador não expõe acesso à câmera aqui.";
      render();
      return;
    }
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function (stream) {
      if (!state.loteFoto) { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      streamLote = stream;
      state.loteFoto.statusCamera = "ativa";
      render();
      var video = document.getElementById("videoLote");
      if (video) { video.srcObject = stream; video.play().catch(function () {}); }
    }).catch(function (e) {
      if (!state.loteFoto) return;
      state.loteFoto.statusCamera = "erro";
      if (e.name === "NotReadableError") {
        state.loteFoto.erro = "a câmera parece estar em uso por outro app ou aba.";
      } else if (e.name === "NotFoundError" || e.name === "OverconstrainedError") {
        state.loteFoto.erro = "não encontrei nenhuma câmera disponível nesse aparelho.";
      } else {
        state.loteFoto.erro = "permissão negada ou bloqueada pelo ambiente.";
      }
      render();
    });
  }

  // Cada pacote pode levar mais de 1 foto (ex: pacote + fachada da loja
  // específica dentro de um shopping) — em vez de amarrar foto->pacote pela
  // posição na lista (1ª foto = 1º pacote, 2ª foto = 2º pacote, sempre),
  // cada foto guarda de propósito QUAL pacote ela é (itemIdx). Esses dois
  // helpers calculam, a partir das fotos já tiradas: qual é o PRÓXIMO
  // pacote ainda sem nenhuma foto (pro botão principal), e qual foi o
  // ÚLTIMO pacote fotografado (pro botão de "foto extra pra esse mesmo").
  // Próximo = o primeiro nome que ainda NÃO tem nenhuma foto (e não
  // "o de depois do último"): se alguém apagar a miniatura de um pacote do
  // meio, o botão precisa voltar a oferecer justamente aquele, senão o
  // pacote ficaria sem foto e sem jeito de refazer sem sair da câmera.
  function proximoItemIdxLote(lote) {
    for (var i = 0; i < lote.itens.length; i++) {
      var temFoto = lote.fotos.some(function (f) { return f.itemIdx === i; });
      if (!temFoto) return i;
    }
    return null;
  }
  // Último = o dono da ÚLTIMA foto tirada (a ordem em que foram tiradas), que
  // é a pessoa que você acabou de fotografar — é a ela que a foto da frente
  // da loja pertence.
  function ultimoItemIdxLote(lote) {
    if (!lote.fotos.length) return null;
    return lote.fotos[lote.fotos.length - 1].itemIdx;
  }
  // Em endereço com loja (shopping), o NOME de cada pacote é a loja pra onde
  // ele vai — é ele que diz em qual porta você tem que estar. Por isso a
  // câmera passou a mostrar o nome em cada botão/miniatura (antes mostrava só
  // "pacote 1, pacote 2", que não ajudava a saber de quem era).
  function nomeItemLote(linha, idx) {
    var n = linha && linha.nome ? String(linha.nome).trim() : "";
    return n || "pacote " + (idx + 1);
  }
  function cortarNome(n, max) {
    return n.length > max ? n.slice(0, max - 1) + "\u2026" : n;
  }
  function fotosDoItemLote(lote, idx) {
    return lote.fotos.filter(function (f) { return f.itemIdx === idx; }).length;
  }

  function tirarFotoLote(modo, tentativas) {
    if (!state.loteFoto || state.loteFoto.statusCamera !== "ativa") return;
    var video = document.getElementById("videoLote");
    if (!video || !video.videoWidth) {
      // Bem no instante em que o botão "Tirar foto" aparece, a câmera às
      // vezes ainda não entregou o primeiro frame (o navegador já liberou o
      // acesso, mas o vídeo ainda tá "carregando") — daí o primeiro toque não
      // fazia nada, e só o segundo (quando o frame já tinha chegado)
      // funcionava. Em vez de simplesmente ignorar o toque, tenta de novo
      // sozinho antes de desistir. Como agora dá pra tirar várias fotos numa
      // sequência rápida no mesmo endereço (pacote + loja específica, por
      // exemplo), a tela de baixo é recriada com mais frequência do que
      // antes — dando mais tempo aqui (uns 3s) evita que um toque rápido
      // demais em sequência pareça "não fez nada".
      tentativas = (typeof tentativas === "number" ? tentativas : 0) + 1;
      if (tentativas <= 60) setTimeout(function () { tirarFotoLote(modo, tentativas); }, 50);
      return;
    }
    var lote = state.loteFoto;
    var itemIdx = 0;
    if (lote.tipo !== "fachada") {
      if (modo === "extra") {
        var ultimo = ultimoItemIdxLote(lote);
        itemIdx = ultimo === null ? proximoItemIdxLote(lote) : ultimo;
      } else {
        var prox = proximoItemIdxLote(lote);
        if (prox === null) return; // todos os pacotes já têm pelo menos 1 foto — só resta "foto extra"
        itemIdx = prox;
      }
      if (itemIdx === null) return;
    }
    var maxLado = 1000;
    var w = video.videoWidth, h = video.videoHeight;
    if (w >= h && w > maxLado) { h = Math.round((h * maxLado) / w); w = maxLado; }
    else if (h > w && h > maxLado) { w = Math.round((w * maxLado) / h); h = maxLado; }
    var canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(video, 0, 0, w, h);
    canvas.toBlob(function (blob) {
      if (!blob || !state.loteFoto) return;
      state.loteFoto.fotos.push({ blob: blob, previewUrl: URL.createObjectURL(blob), itemIdx: itemIdx });
      render();
    }, "image/jpeg", 0.7);
  }

  function removerFotoLote(idx) {
    if (!state.loteFoto) return;
    var removida = state.loteFoto.fotos.splice(idx, 1)[0];
    if (removida) URL.revokeObjectURL(removida.previewUrl);
    render();
  }

  function cancelarLoteFoto() {
    if (state.loteFoto && state.loteFoto.fotos.length > 0) {
      var ok = confirm("Descartar " + state.loteFoto.fotos.length + " " + plural(state.loteFoto.fotos.length, "foto tirada", "fotos tiradas") + "?");
      if (!ok) return;
    }
    pararCameraLote();
    if (state.loteFoto) state.loteFoto.fotos.forEach(function (f) { URL.revokeObjectURL(f.previewUrl); });
    state.loteFoto = null;
    render();
  }

  function enviarLoteFoto() {
    if (!state.loteFoto || !state.loteFoto.fotos.length) return;
    var lote = state.loteFoto;

    if (lote.tipo === "fachada") {
      pararCameraLote();
      state.loteFoto = null;
      render();
      var chaveRotaFachada = sanitizarChaveFirebase(state.minhaRota);
      var chaveFachada = chaveOrdenavel(lote.ruaNome, lote.numero);
      var itemFachada = {
        tipo: "fachada",
        pasta: "fotos/" + chaveRotaFachada + "/fachadas/" + chaveFachada,
        nomeArquivo: "fachada_" + Date.now(),
        chaveRota: chaveRotaFachada, chave: chaveFachada, rua: lote.ruaNome, numero: lote.numero
      };
      processarEnvioFoto(itemFachada, lote.fotos[0].blob);
      lote.fotos.forEach(function (f) { URL.revokeObjectURL(f.previewUrl); });
      return;
    }

    pararCameraLote();
    state.loteFoto = null;
    render();

    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var data = dataDeHoje();
    var chave = chaveOrdenavel(lote.ruaNome, lote.numero);
    // Cada foto já sabe de qual pacote ela é (itemIdx) — não tem mais limite
    // de "1 foto por pacote": um endereço com lojas específicas (shopping)
    // pode ter 2+ fotos por pacote, cada uma vira um "slot" independente.
    // O slot começa depois das que esse pacote JÁ tinha (proximoSlotPacote),
    // não sempre do zero — importante pro caso de "foto extra" num pacote que
    // já tinha sido enviado antes: sem isso, a foto nova sobrescreveria a(s)
    // antiga(s) no mesmo slot em vez de somar.
    lote.itens.forEach(function (linha, idx) {
      var fotosDoItem = lote.fotos.filter(function (f) { return f.itemIdx === idx; });
      var proximoSlot = proximoSlotPacote(linha.id);
      fotosDoItem.forEach(function (f, i) {
        var slotIdx = proximoSlot + i;
        var item = {
          tipo: "pacote",
          pasta: "fotos/" + chaveRota + "/" + data + "/" + chave,
          nomeArquivo: "pacote_" + linha.codigo + "_" + Date.now() + "_" + idx + "_" + slotIdx,
          linhaId: linha.id, chaveRota: chaveRota, data: data, codigo: linha.codigo,
          rua: linha.rua, numero: linha.numero, nome: linha.nome || "", chave: chave, slotIdx: slotIdx,
          quemRecebeuSnapshot: (state.entregaInfo[linha.id] && state.entregaInfo[linha.id].quemRecebeu) || ""
        };
        processarEnvioFoto(item, f.blob);
      });
    });
    lote.fotos.forEach(function (f) { URL.revokeObjectURL(f.previewUrl); });
  }

  function salvarQuemRecebeu(linhaId, valor) {
    if (!state.entregaInfo[linhaId]) state.entregaInfo[linhaId] = {};
    state.entregaInfo[linhaId].quemRecebeu = valor;
    if (fbDb && state.minhaRota && state.linhasParseadas) {
      var linha = state.linhasParseadas.find(function (l) { return l.id === linhaId; });
      if (linha && linha.codigo) {
        var chaveRota = sanitizarChaveFirebase(state.minhaRota);
        fbDb.ref("lotes/" + chaveRota + "/entregas/" + dataDeHoje() + "/" + linha.codigo + "/quemRecebeu").set(valor);
      }
    }
  }

  // Todos os pacotes de um mesmo prédio/número (mesma rua canônica + mesmo
  // número), na ordem em que aparecem na lista colada.
  function linhasDoEndereco(ruaNome, numero) {
    if (!state.linhasParseadas) return [];
    return state.linhasParseadas.filter(function (l) {
      if (l.erro || String(l.numero) !== String(numero)) return false;
      var ruaMatch = encontrarRuaMapeada(l.rua, state.mapaRuas);
      // Rua ainda não cadastrada nas Faixas: compara pelo nome cru da lista
      // (é assim que a caixa cinza "sem faixa" identifica o endereço dela).
      if (!ruaMatch) return normalizar(l.rua) === normalizar(ruaNome);
      return ruaMatch.nome === ruaNome;
    });
  }

  // "Quem recebeu" por endereço: quando um prédio/número tem mais de um
  // pacote, evita pedir o nome pacote por pacote (na prática quem entrega não
  // confere nome nenhum, só pega tudo daquele número — geralmente é o
  // porteiro recebendo o lote inteiro). Um único campo aplica o nome pra
  // todos os pacotes daquele endereço de uma vez, incluindo os que ainda vão
  // ganhar foto depois (o nome já fica salvo e entra na foto quando ela for
  // tirada).
  function aplicarQuemRecebeuEndereco(ruaNome, numero, valor, gravarFirebase) {
    var linhas = linhasDoEndereco(ruaNome, numero);
    var chaveRota = (gravarFirebase && fbDb && state.minhaRota) ? sanitizarChaveFirebase(state.minhaRota) : null;
    var data = dataDeHoje();
    linhas.forEach(function (l) {
      if (!state.entregaInfo[l.id]) state.entregaInfo[l.id] = {};
      state.entregaInfo[l.id].quemRecebeu = valor;
      if (chaveRota && l.codigo) {
        fbDb.ref("lotes/" + chaveRota + "/entregas/" + data + "/" + l.codigo + "/quemRecebeu").set(valor);
      }
    });
  }

  // Um número que é SHOPPING não tem porteiro recebendo tudo: cada nome da
  // lista é uma loja e quem assina é uma pessoa diferente em cada uma. Nesse
  // caso o endereço entra em modo "loja por loja" e cada pacote ganha seu
  // próprio campo de quem recebeu.
  //
  // Entra nesse modo de três formas, pra nunca ficar preso no jeito errado:
  //   1. o entregador toca no botão "loja por loja";
  //   2. algum pacote daquele número já tem 2 fotos (pacote + frente da loja),
  //      que é exatamente o que se faz num shopping;
  //   3. os pacotes daquele número já têm nomes DIFERENTES de quem recebeu
  //      (um campo só não conseguiria nem mostrar isso direito).
  function enderecoEhIndividual(chaveEndereco, itens) {

      state.avisoArmazenamento = "O armazenamento do celular está cheio e o progresso de hoje NÃO está sendo salvo neste aparelho. Se o app fechar, o que foi separado/entregue se perde. Envie as fotos pendentes e, se continuar, limpe dados de outros sites no navegador.";
    }
  }

  // Foco a restaurar depois de tirar uma foto. A câmera nativa do celular tira
  // o navegador de tela (às vezes chega a recarregar a página, dependendo do
  // aparelho) — ao voltar, sem isso a lista sempre pulava pro topo, obrigando
  // a rolar tudo de novo até achar o pacote em que estava. Guarda qual
  // pacote/endereço estava em uso ANTES de abrir a câmera (também no
  // localStorage, pra sobreviver mesmo se a página recarregar de verdade) e,
  // na primeira renderização depois, rola até ele e descarta — não deve
  // "grudar" nas renderizações seguintes (ex: quando o ajudante atualiza algo
  // pelo Firebase), só nessa próxima.
  var focoAncora = null;
  function definirFoco(id) {
    focoAncora = id;
    salvar("foco-ancora", id);
  }

  state.mapaRuas = normalizarMapaRuas(carregar("mapa-ruas", []));
  // o texto colado da API pode ser grande; guarda pra sobreviver se o Android
  // descartar a aba enquanto a pessoa vai buscar o JSON no proxy
  state.jsonImport.rascunho = carregar("json-import-rascunho", "");
  try { localStorage.removeItem("lens-capturas"); } catch (e) { /* ignora */ }
  state.contadorGlobal = carregar("contador-pacotes-total", 0);
  state.minhaRota = carregar("minha-rota", "");
  state.filaPendente = carregar("fila-fotos-pendentes", []);
  state.bipeAtivo = carregar("bipe-ativo", true);
  focoAncora = carregar("foco-ancora", null);
  var sess = carregar("sessao-atual", null);
  // Sessão de outro dia não volta pra tela: o progresso dela é de outra
  // lista. Sessão antiga (gravada antes deste carimbo existir) continua
  // sendo aceita, pra ninguém perder o que está no meio agora.
  if (sess && sess.dia && sess.dia !== dataDeHoje()) sess = null;
  if (sess) {
    state.textoColado = sess.texto || "";
    state.linhasParseadas = sess.linhas || null;
    state.pacoteStatus = sess.pacoteStatus || {};
    state.enderecosIndividuais = sess.enderecosIndividuais || {};
  }

  function adicionarRua() {
    var nome = (state.novoNomeRua || "").trim();
    if (!nome) return;
    state.mapaRuas.push({ id: "R" + Date.now(), nome: nome, cores: coresPadrao() });
    state.novoNomeRua = "";
    salvarMapa();
    render();
  }
  function removerRua(id) {
    // Agora que as Faixas são compartilhadas por rota, apagar uma rua aqui
    // apaga pra todo mundo que usa o mesmo código — por isso o aviso antes.
    var rua = state.mapaRuas.find(function (r) { return r.id === id; });
    var aviso = "Apagar a rua \"" + ((rua && rua.nome) || "") + "\" das Faixas?";
    if (fbDb && state.minhaRota) aviso += "\n\nIsso vale pra todo mundo que usa o código de rota " + state.minhaRota + ".";
    if (!confirm(aviso)) return;
    state.mapaRuas = state.mapaRuas.filter(function (r) { return r.id !== id; });
    salvarMapa();
    render();
  }
  function toggleFragmentar(ruaId, valor) {
    var rua = state.mapaRuas.find(function (r) { return r.id === ruaId; });
    if (!rua) return;
    rua.fragmentar = valor;
    salvarMapa();
    render();
  }
  // Até que número vai cada lado da rua, de verdade — não pra travar nada,
  // só pra saber que "702" numa rua que só vai até uns 470 não é o número da
  // casa: é o número do apartamento colado na frente, e o número de casa de
  // verdade está sobrando em outro campo do endereço. Opcional: rua sem isso
  // cadastrado passa pela ferramenta do jeito que sempre passou.
  function definirMaxRua(ruaId, lado, valor) {
    var rua = state.mapaRuas.find(function (r) { return r.id === ruaId; });
    if (!rua) return;
    var n = parseInt(valor, 10);
    if (lado === "par") rua.maxPar = (valor && n > 0) ? n : undefined;
    else rua.maxImpar = (valor && n > 0) ? n : undefined;
    salvarMapa();
  }
  function definirCor(ruaId, campo, hex) {
    var rua = state.mapaRuas.find(function (r) { return r.id === ruaId; });
    if (!rua) return;
    if (!rua.cores) rua.cores = coresPadrao();
    rua.cores[campo] = hex;
    salvarMapa();
    render();
  }
  function toggleAbrirPaleta(chave) {
    state.paletaAberta = (state.paletaAberta === chave) ? null : chave;
    render();
  }
  function escolherCor(ruaId, campo, cor) {
    state.paletaAberta = null;
    definirCor(ruaId, campo, cor);
  }

  // ---------- lista do dia na nuvem ----------
  // Antes, a lista colada ficava só no aparelho de quem colou — os outros que
  // trabalham na mesma rota tinham que colar tudo de novo, cada um no seu
  // celular. Agora ela sobe junto com a rota: quem entra depois só põe o
  // código da rota e já cai com a lista pronta, com o progresso e as fotos de
  // quem já começou. Fica guardada por data, então vira o dia e some sozinha.
  //
  // Modelo simples de propósito: a lista da nuvem é A lista do dia da rota.
  // Quem organizar por último vale pra todo mundo — do mesmo jeito que hoje
  // só uma pessoa cola a lista pra todos.
  function enviarListaParaNuvem() {
    if (!fbDb || !state.minhaRota) return;
    fbDb.ref("lotes/" + sanitizarChaveFirebase(state.minhaRota) + "/lista/" + dataDeHoje())
      .set({ texto: state.textoColado, ts: Date.now() });
  }
  function removerListaDaNuvem() {
    if (!fbDb || !state.minhaRota) return;
    fbDb.ref("lotes/" + sanitizarChaveFirebase(state.minhaRota) + "/lista/" + dataDeHoje()).remove();
  }
  // Depois de adotar a lista da nuvem, o que já foi separado/fotografado
  // precisa ser lido de novo: os listeners de pacotes e entregas só disparam
  // quando algo MUDA lá, e eles já tinham rodado sem efeito nenhum antes de
  // existir lista aqui pra casar os códigos. Reaproveita os próprios
  // callbacks, então a regra de aplicar é uma só.
  function recarregarProgressoDaRota(chaveRota, data) {
    if (!fbDb) return;
    fbDb.ref("lotes/" + chaveRota + "/pacotes").once("value").then(function (snap) {
      if (callbackPacotesAtual) callbackPacotesAtual(snap);
    }).catch(function () {});
    fbDb.ref("lotes/" + chaveRota + "/entregas/" + data).once("value").then(function (snap) {
      if (callbackEntregasAtual) callbackEntregasAtual(snap);
    }).catch(function () {});
  }

  function organizarPacotes() {
    var linhasNovas = parseLinhas(state.textoColado);

    // Organizar uma lista NOVA por cima de outra: as marcações da lista
    // anterior não valem pra esta (são de outros pacotes), então o progresso
    // local começa do zero — igual já acontece quando a lista chega pela
    // nuvem. Sem isso, colar a lista de hoje por cima da de ontem trazia
    // marcação fantasma pra tela e, no reload seguinte, o app ainda
    // empurrava essas marcações fantasma pros celulares dos colegas.
    var listaMudou = state.linhasParseadas &&
      state.linhasParseadas.map(function (l) { return l.codigo; }).join("|") !== linhasNovas.map(function (l) { return l.codigo; }).join("|");
    if (listaMudou) {
      state.pacoteStatus = {};
      state.entregaInfo = {};
    }

    state.linhasParseadas = linhasNovas;
    state.encontrados = {};
    salvarSessao();
    enviarListaParaNuvem();
    // Puxa de volta o que a rota já tem hoje (o que o colega já separou, as
    // fotos e os nomes de quem recebeu). Sem isso, quem colava a lista num
    // aparelho novo começava do zero na tela mesmo com a rota já andando —
    // os avisos da nuvem só chegam quando ALGUÉM grava algo novo, e aqui
    // ninguém tinha gravado ainda.
    if (fbDb && state.minhaRota) recarregarProgressoDaRota(sanitizarChaveFirebase(state.minhaRota), dataDeHoje());
    render();
  }
  var refPacotesAtual = null;
  var callbackPacotesAtual = null;
  var refEntregasAtual = null;
  var callbackEntregasAtual = null;
  var refFachadasAtual = null;
  var callbackFachadasAtual = null;
  var refFaixasAtual = null;
  var callbackFaixasAtual = null;
  var refListaAtual = null;
  var callbackListaAtual = null;
  var refConectado = null;
  var callbackConectado = null;

  function desconectarRota() {
    if (refPacotesAtual && callbackPacotesAtual) refPacotesAtual.off("value", callbackPacotesAtual);
    if (refEntregasAtual && callbackEntregasAtual) refEntregasAtual.off("value", callbackEntregasAtual);
    if (refFachadasAtual && callbackFachadasAtual) refFachadasAtual.off("value", callbackFachadasAtual);
    if (refFaixasAtual && callbackFaixasAtual) refFaixasAtual.off("value", callbackFaixasAtual);
    if (refListaAtual && callbackListaAtual) refListaAtual.off("value", callbackListaAtual);
    if (refConectado && callbackConectado) refConectado.off("value", callbackConectado);
    refConectado = null; callbackConectado = null;
    state.conexaoViva = null;
    refPacotesAtual = null; callbackPacotesAtual = null;
    refEntregasAtual = null; callbackEntregasAtual = null;
    refFachadasAtual = null; callbackFachadasAtual = null;
    refFaixasAtual = null; callbackFaixasAtual = null;
    refListaAtual = null; callbackListaAtual = null;
  }

  function limparFotosAntigas(chaveRota) {
    // As fotos agora ficam no Cloudinary via upload "unsigned", que não dá pra
    // apagar direto pelo navegador sem expor a API secret da conta. Aqui só
    // limpamos os registros antigos do Firebase; as imagens em si continuam no
    // Cloudinary (dá pra apagar manualmente de vez em quando pelo Media Library,
    // se quiser liberar espaço).
    // "fachadas_permanentes" fica de fora de propósito: não é organizado por
    // data (é por endereço, pra sempre), então não faz sentido limpar por
    // idade — e limpar aqui usando essa mesma lógica ia apagar tudo por
    // engano (a chave lá é do endereço, não uma data, e viraria NaN dia).
    if (!fbDb) return;
    ["entregas"].forEach(function (secao) {
      fbDb.ref("lotes/" + chaveRota + "/" + secao).once("value").then(function (snap) {
        var porData = snap.val() || {};
        Object.keys(porData).forEach(function (dataStr) {
          if (diasEntre(dataStr, dataDeHoje()) <= 2) return;
          fbDb.ref("lotes/" + chaveRota + "/" + secao + "/" + dataStr).remove();
        });
      }).catch(function () {});
    });
  }

  function conectarRota(rota) {
    desconectarRota();
    state.rotaConectada = false;
    if (!fbDb || !rota) return;
    var chaveRota = sanitizarChaveFirebase(rota);

    // "Conectado" verde só enquanto a conexão existe DE VERDADE. Antes ele
    // acendia na primeira resposta e nunca mais apagava: sem sinal no
    // subsolo do prédio, o app continuava dizendo "compartilhando com quem
    // usar esse mesmo código" e o entregador achava que o colega estava
    // vendo o trabalho dele. ".info/connected" é o próprio Firebase dizendo
    // se o canal está de pé.
    // Se por algum motivo esse caminho não responder (versão diferente do
    // SDK, por exemplo), "conexaoViva" fica null e o app se comporta como
    // antes — o indicador nunca fica preso em "sem sinal" por causa disso.
    try {
      if (!refConectado) {
        refConectado = fbDb.ref(".info/connected");
        callbackConectado = function (snap) {
          var online = snap.val();
          if (online === null || online === undefined) return;
          var vivo = online === true;
          if (state.conexaoViva !== vivo) {
            state.conexaoViva = vivo;
            render();
          }
        };
        refConectado.on("value", callbackConectado);
      }
    } catch (e) { refConectado = null; callbackConectado = null; }

    fbDb.ref("rotas_registradas/" + chaveRota).set(Date.now());
    limparFotosAntigas(chaveRota);

    refFaixasAtual = fbDb.ref("lotes/" + chaveRota + "/faixas");
    callbackFaixasAtual = function (snapshot) {
      var remoto = snapshot.val();
      var ruasRemotas = (remoto && remoto.ruas && remoto.ruas.length) ? remoto.ruas : null;

      if (!ruasRemotas) {
        // Nuvem ainda sem nada pra essa rota: se este aparelho já tem faixas
        // configuradas, ele vira a fonte e faz o primeiro backup.
        if (state.mapaRuas.length) enviarFaixasParaNuvem();
        return;
      }
      var normalizadas = normalizarMapaRuas(ruasRemotas);

      // Este aparelho já tem faixas configuradas. A regra continua sendo "o
      // que está aqui manda" — nenhuma rua daqui é apagada nem tem a cor
      // trocada pela nuvem. Mas rua que só existe lá agora ENTRA: antes ela
      // era ignorada pra sempre, e os pacotes daquela rua ficavam na caixa
      // cinza no celular dos colegas enquanto apareciam coloridos no de quem
      // cadastrou — num sistema onde a separação é por cor, cada celular
      // mostrando uma coisa é problema de verdade no galpão.
      if (state.mapaRuas.length) {
        var jaTenho = {};
        state.mapaRuas.forEach(function (r) { jaTenho[normalizar(r.nome)] = true; });
        var novas = normalizadas.filter(function (r) { return !jaTenho[normalizar(r.nome)]; });
        if (!novas.length) return;
        state.mapaRuas = state.mapaRuas.concat(novas);
        salvar("mapa-ruas", state.mapaRuas);
        render();
        return;
      }
      // Aparelho sem nada configurado: restaura da nuvem, porque não há o que
      // perder aqui (celular novo, navegador limpo, ou colega entrando na
      // rota pela primeira vez).
      state.mapaRuas = normalizadas;
      salvar("mapa-ruas", state.mapaRuas);
      render();
    };
    refFaixasAtual.on("value", callbackFaixasAtual);

    var data = dataDeHoje();
    refEntregasAtual = fbDb.ref("lotes/" + chaveRota + "/entregas/" + data);
    callbackEntregasAtual = function (snapshot) {
      var dados = snapshot.val() || {};
      var novo = {};
      Object.keys(dados).forEach(function (codigo) {
        var item = dados[codigo];
        // TODAS as linhas com esse código, não só a primeira: numa lista com
        // código repetido, a segunda encomenda nunca mostrava o "✓ Foto" e o
        // app achava que ela estava sem foto (a foto nova ia pro mesmo slot e
        // sobrescrevia a anterior).
        var linhas = (state.linhasParseadas || []).filter(function (l) { return !l.erro && l.codigo === codigo; });
        if (!linhas.length) return;
        // Compatibilidade com fotos tiradas antes dessa atualização (campo
        // antigo "fotoPacoteUrl", uma foto só) — trata como se fosse a foto
        // do slot 0, assim nada some pra quem já tinha tirado foto hoje.
        var fotos = item.fotos || (item.fotoPacoteUrl ? { "0": item.fotoPacoteUrl } : {});
        linhas.forEach(function (linha) {
          novo[linha.id] = { quemRecebeu: item.quemRecebeu || "", fotos: fotos };
        });
      });
      // O que a pessoa está digitando AGORA vale mais que o que veio da
      // nuvem. Sem isso, uma foto subindo (a sua ou a do colega) trocava o
      // objeto inteiro e apagava o nome de quem recebeu no meio da digitação
      // — e como o campo focado é destruído pelo render, o "onblur" nunca
      // rodava e o nome não chegava nem no Firebase. Sumia sem rastro.
      var editando = document.activeElement;
      if (editando && editando.tagName === "INPUT" && editando.getAttribute("data-action") &&
          editando.getAttribute("data-action").indexOf("quem-recebeu") === 0) {
        var idEditando = editando.getAttribute("data-id");
        // Pacote que ainda não tem registro na nuvem (primeira entrega do dia,
        // nada subiu ainda) não existe em "novo" — antes isso fazia o que
        // estava sendo digitado ser descartado justamente no caso mais comum.
        // Agora a entrada é criada pra segurar o texto.
        if (idEditando) {
          if (!novo[idEditando]) novo[idEditando] = { quemRecebeu: "", fotos: [] };
          novo[idEditando].quemRecebeu = editando.value;
        } else {
          // campo do endereço inteiro: preserva em todas as linhas daquele nº
          var ruaEd = editando.getAttribute("data-rua");
          var numEd = editando.getAttribute("data-numero");
          if (ruaEd != null && numEd != null) {
            linhasDoEndereco(ruaEd, numEd).forEach(function (l) {
              if (!novo[l.id]) novo[l.id] = { quemRecebeu: "", fotos: [] };
              novo[l.id].quemRecebeu = editando.value;
            });
          }
        }
      }
      state.entregaInfo = novo;
      render();
    };
    refEntregasAtual.on("value", callbackEntregasAtual);

    refFachadasAtual = fbDb.ref("lotes/" + chaveRota + "/fachadas_permanentes");
    callbackFachadasAtual = function (snapshot) {
      var dados = snapshot.val() || {};
      var novo = {};
      Object.keys(dados).forEach(function (chave) { novo[chave] = dados[chave].fotoFachadaUrl || ""; });
      state.fachadaInfo = novo;
      render();
    };
    refFachadasAtual.on("value", callbackFachadasAtual);

    refPacotesAtual = fbDb.ref("lotes/" + chaveRota + "/pacotes");
    var primeiraLeitura = true;
    callbackPacotesAtual = function (snapshot) {
      state.rotaConectada = true;
      var dados = snapshot.val() || {};
      if (!state.linhasParseadas) { render(); return; }
      // Código repetido em mais de uma linha (ver aviso em calcularResultado)
      // faz mais de um id de linha "torcer" pro mesmo código — antes isso
      // guardava só o ÚLTIMO id de cada código, então uma confirmação da
      // nuvem (inclusive a do próprio aparelho, voltando depois do envio)
      // podia cair marcada numa encomenda ERRADA, sem ninguém ter escaneado
      // ou clicado nela. Agora guarda TODAS as linhas daquele código.
      var porCodigo = {};
      state.linhasParseadas.forEach(function (l) {
        if (l.erro || !l.codigo) return;
        if (!porCodigo[l.codigo]) porCodigo[l.codigo] = [];
        porCodigo[l.codigo].push(l.id);
      });
      var mudou = false;
      var hojeStr = dataDeHoje();
      Object.keys(dados).forEach(function (codigo) {
        var idsDoCodigo = porCodigo[codigo];
        if (!idsDoCodigo || !idsDoCodigo.length) return;
        var remoto = dados[codigo] || {};
        // Marcação de OUTRO dia não vale pra lista de hoje. É isso que impede
        // um ensaio na véspera (ou a entrega anterior do mesmo código, em
        // reentrega) de abrir a lista de hoje com pacotes já marcados como
        // separados, sem ninguém ter tocado neles.
        // Registro SEM o carimbo "dia" pode ser de duas origens: um colega
        // ainda com a versão anterior do app (aí é trabalho de verdade,
        // acontecendo agora, e tem que valer) ou sobra de outro dia. O "ts"
        // desempata: sem carimbo, só vale se for de hoje pelo relógio.
        if (remoto.dia) {
          if (remoto.dia !== hojeStr) return;
        } else {
          var tsRemoto = typeof remoto.ts === "number" ? remoto.ts : 0;
          if (!tsRemoto) return;
          var inicioDeHoje = new Date(); inicioDeHoje.setHours(0, 0, 0, 0);
          if (tsRemoto < inicioDeHoje.getTime()) return;
        }
        var novo = { separado: !!remoto.separado, entregue: !!remoto.entregue, devolvido: !!remoto.devolvido };
        // Código único (o caso normal): sempre foi só 1 id, comportamento
        // idêntico ao de antes. Código repetido: se alguma das linhas já
        // bate com o que a nuvem mandou, não mexe em nada (evita marcar uma
        // encomenda de verdade sem ninguém ter tocado nela); só quando
        // NENHUMA bate é que aplica numa linha ainda intocada, pra avançar
        // sempre uma encomenda física diferente por vez — igual ao scanner.
        var jaBate = idsDoCodigo.some(function (id) {
          var st = state.pacoteStatus[id] || { separado: false, entregue: false, devolvido: false };
          return st.separado === novo.separado && st.entregue === novo.entregue && st.devolvido === novo.devolvido;
        });
        if (jaBate) return;
        var linhaId = idsDoCodigo.find(function (id) { return !state.pacoteStatus[id]; }) || idsDoCodigo[0];
        state.pacoteStatus[linhaId] = novo;
        mudou = true;
      });
      if (primeiraLeitura) {
        primeiraLeitura = false;
        state.linhasParseadas.forEach(function (l) {
          if (l.erro || !l.codigo) return;
          var localSt = state.pacoteStatus[l.id];
          if (!localSt) return;
          // Só compara com registro do MESMO dia — de outro dia é como se não
          // existisse (mesma regra da leitura acima).
          var remotoSt = (dados[l.codigo] && dados[l.codigo].dia === hojeStr) ? dados[l.codigo] : {};
          var atrasado = (localSt.separado && !remotoSt.separado) || (localSt.entregue && !remotoSt.entregue) || (localSt.devolvido && !remotoSt.devolvido);
          if (atrasado) fbDb.ref("lotes/" + chaveRota + "/pacotes/" + l.codigo).set({
            separado: !!localSt.separado, entregue: !!localSt.entregue, devolvido: !!localSt.devolvido,
            ts: Date.now(), dia: hojeStr
          });
        });
        limparPacotesAntigos(chaveRota, dados);
      }
      if (mudou) salvarSessao();
      render();
    };
    refPacotesAtual.on("value", callbackPacotesAtual, function () { state.rotaConectada = false; render(); });

    // Assinado por último de propósito: quando a lista da nuvem chega, ela
    // chama os callbacks de pacotes/entregas acima, que já precisam existir.
    refListaAtual = fbDb.ref("lotes/" + chaveRota + "/lista/" + data);
    callbackListaAtual = function (snapshot) {
      var remoto = snapshot.val();
      var texto = (remoto && typeof remoto.texto === "string") ? remoto.texto : "";
      // Nuvem sem lista pra hoje: não mexe em nada aqui (é o caso de alguém
      // ter limpado — quem já está com a lista aberta continua trabalhando).
      if (!texto.trim()) return;
      // Já é exatamente essa lista: nada a fazer (evita re-render à toa e
      // volta-e-meia depois do próprio envio).
      if (texto === state.textoColado && state.linhasParseadas) return;
      // Lista que esta pessoa já disse que não queria: não pergunta de novo.
      if (listasRecusadas[texto]) return;

      // Este aparelho JÁ está trabalhando numa lista e chegou outra da nuvem
      // (um colega organizou "a parte dele", que é o instinto natural quando
      // são três dividindo a rota). Antes a tela trocava sozinha, zerando o
      // progresso à vista, sem uma palavra — e o pessoal só via os pacotes
      // sumirem. Agora quem está trabalhando decide.
      if (state.linhasParseadas && state.linhasParseadas.length) {
        var qtdAtual = state.linhasParseadas.length;
        var qtdNova = parseLinhas(texto).length;
        var separadosAqui = 0;
        state.linhasParseadas.forEach(function (l) { if (statusDe(l.id).separado) separadosAqui++; });
        var trocar = confirm(
          "Um colega organizou uma lista diferente nesta rota.\n\n" +
          "A sua tem " + qtdAtual + " " + plural(qtdAtual, "pacote", "pacotes") + " (" + separadosAqui + " já " + plural(separadosAqui, "separado", "separados") + ").\n" +
          "A dele tem " + qtdNova + " " + plural(qtdNova, "pacote", "pacotes") + ".\n\n" +
          "Trocar pela lista dele? (Se você está no meio da separação, escolha Cancelar e combine com ele quem cola a lista.)"
        );
        if (!trocar) {
          // Fica com a lista daqui e devolve ela pra nuvem, pra não ficar
          // um aparelho de cada jeito. Mas ANOTA qual lista foi recusada:
          // sem isso os dois aparelhos entravam num pingue-pongue sem fim —
          // cada "Cancelar" reenviava a lista daqui, o que fazia a pergunta
          // aparecer no celular do colega, que cancelava e devolvia a dele, e
          // assim por diante, com os dois travados em caixa de diálogo.
          listasRecusadas[texto] = true;
          enviarListaParaNuvem();
          return;
        }
      }

      state.textoColado = texto;
      state.linhasParseadas = parseLinhas(texto);
      // Zera o progresso local antes de reaplicar o da nuvem: se este
      // aparelho tinha uma lista antiga, as marcações dela são de outros
      // pacotes e não valem mais nada aqui.
      state.pacoteStatus = {};
      salvarSessao();
      recarregarProgressoDaRota(chaveRota, data);
      render();
    };
    refListaAtual.on("value", callbackListaAtual);
  }

  // Listas da nuvem que esta pessoa já recusou nesta sessão (ver
  // callbackListaAtual). Some ao recarregar o app, que é quando faz sentido
  // perguntar de novo.
  var listasRecusadas = {};

  function salvarMinhaRota(rota) {
    state.minhaRota = rota;
    salvar("minha-rota", rota);
    conectarRota(rota);
    render();
  }

  // Sair da rota: desliga a sincronização e devolve este aparelho pro modo
  // "só aqui". Leva junto a lista do dia (ela é da rota — não faz sentido
  // continuar aberta fora dela) e o progresso local, mas NÃO mexe em nada na
  // nuvem: lista, marcações e fotos seguem lá pros colegas. As Faixas ficam,
  // porque são a sua configuração de ruas, não uma coisa do dia.
  function sairDaRota() {
    if (!state.minhaRota) return;
    var aviso = "Sair da rota " + state.minhaRota + " neste aparelho?\n\n" +
      "A lista de hoje sai daqui, mas continua na nuvem pros outros. Suas ruas (Faixas) ficam.";
    if (state.filaPendente.length) {
      aviso += "\n\nAten\u00e7\u00e3o: ainda " + (state.filaPendente.length === 1 ? "h\u00e1 1 foto esperando envio" : "h\u00e1 " + state.filaPendente.length + " fotos esperando envio") + ".";
    }
    if (!confirm(aviso)) return;
    desconectarRota();
    state.minhaRota = "";
    state.rotaConectada = false;
    salvar("minha-rota", "");
    state.textoColado = ""; state.linhasParseadas = null; state.pacoteStatus = {};
    state.entregaInfo = {}; state.fachadaInfo = {};
    salvarSessao();
    render();
  }

  function sincronizarPacote(id) {
    if (!fbDb || !state.minhaRota || !state.linhasParseadas) return;
    var linha = state.linhasParseadas.find(function (l) { return l.id === id; });
    if (!linha || !linha.codigo) return;
    var chaveRota = sanitizarChaveFirebase(state.minhaRota);
    var st = state.pacoteStatus[id] || {};
    // O "ts" é o que permite saber, depois, de que dia é cada marcação — sem
    // ele não dava pra limpar o nó "pacotes" (ver limparPacotesAntigos).
    // O "dia" é o carimbo do DIA da separação: o nó "pacotes" é guardado por
    // código, sem data no caminho, então sem esse carimbo a marcação de um
    // ensaio (ou de uma entrega anterior do mesmo código, o que é comum em
    // reentrega) voltava aplicada numa lista de outro dia, como se alguém já
    // tivesse separado o pacote. Ver callbackPacotesAtual, que ignora
    // marcação de dia diferente.
    fbDb.ref("lotes/" + chaveRota + "/pacotes/" + linha.codigo).set({
      separado: !!st.separado, entregue: !!st.entregue, devolvido: !!st.devolvido,
      ts: Date.now(), dia: dataDeHoje()
    });
  }

  // "entregas" é separado por data e já era limpo depois de 2 dias, mas
  // "pacotes" não tem data no caminho: ele ia acumulando TODOS os códigos de
  // TODOS os dias da rota, pra sempre. Em ~400 pacotes/dia isso vira dezenas
  // de milhares de registros que o app rebaixa inteiros toda vez que abre —
  // fica lento e queima a franquia de download do Firebase (o plano gratuito
  // dá 10 GB/mês; estourou, o banco para de responder e a sincronização morre
  // sozinha no meio do mês).
  // Só roda num aparelho que já tem a lista de hoje carregada, e nunca
  // encosta nos códigos dessa lista nem em marcação recente de outro dia.
  function limparPacotesAntigos(chaveRota, dados) {
    if (!fbDb || !state.linhasParseadas || !dados) return;
    var deHoje = {};
    state.linhasParseadas.forEach(function (l) { if (!l.erro && l.codigo) deHoje[l.codigo] = true; });
    var limite = Date.now() - 2 * 86400000;
    var apagar = {};
    var n = 0;
    Object.keys(dados).forEach(function (codigo) {
      if (deHoje[codigo]) return;
      var ts = dados[codigo] && dados[codigo].ts;
      if (typeof ts === "number" && ts > limite) return;
      apagar[codigo] = null;
      n++;
    });
    // Uma única chamada apaga tudo de uma vez (em vez de milhares de remoções
    // separadas, que sozinhas já dariam o problema que estamos evitando).
    if (n) fbDb.ref("lotes/" + chaveRota + "/pacotes").update(apagar).catch(function () {});
  }

  function incrementarContadorGlobal() {
    if (fbDb) {
      fbDb.ref("contador_global").transaction(function (atual) { return (atual || 0) + 1; });
    } else {
      state.contadorGlobal = (state.contadorGlobal || 0) + 1;
      salvar("contador-pacotes-total", state.contadorGlobal);
    }
  }

  if (fbDb) {
    fbDb.ref("contador_global").on("value", function (snap) {
      var v = snap.val();
      if (typeof v === "number") { state.contadorGlobal = v; render(); }
    });
    fbDb.ref("rotas_registradas").on("value", function (snap) {
      var v = snap.val();
      state.totalRotas = v ? Object.keys(v).length : 0;
      render();
    });
  }
  function statusDe(id) {
    return state.pacoteStatus[id] || { separado: false, entregue: false, devolvido: false };
  }
  function marcarSeparado(id, valor) {
    if (!state.pacoteStatus[id]) state.pacoteStatus[id] = { separado: false, entregue: false, devolvido: false };
    var jaEstava = state.pacoteStatus[id].separado;
    state.pacoteStatus[id].separado = valor;
    if (valor && !jaEstava) incrementarContadorGlobal();
    sincronizarPacote(id);
    salvarSessao();
    render();
  }
  function marcarEntrega(id, campo) {
    if (!state.pacoteStatus[id]) state.pacoteStatus[id] = { separado: false, entregue: false, devolvido: false };
    var atual = state.pacoteStatus[id];
    var ligar = !atual[campo];
    atual[campo] = ligar;
    if (campo === "entregue" && ligar) atual.devolvido = false;
    if (campo === "devolvido" && ligar) atual.entregue = false;
    sincronizarPacote(id);
    salvarSessao();
    render();
  }
  function limparSessao() {
    // Ganhou confirmação porque agora também tira a lista compartilhada da
    // rota (senão, ao recarregar a página, a lista antiga voltaria da nuvem).
    // Não apaga a lista que já está aberta no celular dos outros: eles seguem
    // trabalhando até alguém organizar uma lista nova.
    var aviso = "Limpar a lista de hoje e começar um novo dia?";
    if (fbDb && state.minhaRota) aviso += "\n\nA lista compartilhada da rota " + state.minhaRota + " também sai — quem já está com ela aberta continua trabalhando normal.";
    if (!confirm(aviso)) return;

    // Apaga também as MARCAÇÕES desses pacotes na nuvem. Sem isso, elas
    // ficavam guardadas por código (sem data nenhuma) e a limpeza automática
    // de 2 dias nunca chegava nelas — então recolar a mesma lista (um ensaio
    // na véspera, uma reentrega no dia seguinte) trazia tudo de volta já
    // marcado como separado, sem ninguém ter tocado. "Começar um novo dia"
    // agora começa mesmo do zero.
    if (fbDb && state.minhaRota && state.linhasParseadas) {
      var chaveRotaLimpar = sanitizarChaveFirebase(state.minhaRota);
      var apagar = {};
      var qtd = 0;
      state.linhasParseadas.forEach(function (l) {
        if (l.erro || !l.codigo) return;
        apagar[l.codigo] = null;
        qtd++;
      });
      if (qtd) fbDb.ref("lotes/" + chaveRotaLimpar + "/pacotes").update(apagar).catch(function () {});
    }

    state.textoColado = ""; state.linhasParseadas = null; state.pacoteStatus = {};
    state.entregaInfo = {};
    salvarSessao();
    removerListaDaNuvem();
    render();
  }

  // Agrupa as entregas cruas do Firebase por endereço (chave) — usado tanto
  // pelo zip do dia inteiro quanto pelo zip de um endereço só, pra nunca
  // desencontrar o critério de "virou VARIAS-LOJAS" nem o nome dos arquivos
  // entre os dois.
  function montarGruposParaZip(entregas, fachadas) {
    var porChave = {};
    Object.keys(entregas).forEach(function (codigo) {
      var it = entregas[codigo];
      if (!it.chave) return;
      if (!porChave[it.chave]) porChave[it.chave] = { rua: it.rua, numero: it.numero, pacotes: [], fachadaUrl: null, quemRecebeu: "" };
      // Um pacote pode ter mais de uma foto agora (ex: loja específica
      // dentro de um shopping) — cada uma vira um arquivo no zip. O "|| []"
      // com fallback pro campo antigo "fotoPacoteUrl" é só compatibilidade
      // com fotos tiradas antes dessa atualização.
      var urlsDoPacote = it.fotos
        ? Object.keys(it.fotos).sort(function (a, b) { return (+a) - (+b); }).map(function (k) { return it.fotos[k]; })
        : (it.fotoPacoteUrl ? [it.fotoPacoteUrl] : []);
      // Prioriza quem realmente recebeu (ex: porteiro) sobre o nome do
      // destinatário da lista colada — é o que sai na foto agora.
      urlsDoPacote.forEach(function (url, slot) {
        porChave[it.chave].pacotes.push({ nome: it.quemRecebeu || it.nome || "pacote", codigo: codigo, url: url, slot: slot });
      });
      // Guarda também no nível do endereço, pra ir no nome da pasta do zip.
      if (!porChave[it.chave].quemRecebeu && it.quemRecebeu) porChave[it.chave].quemRecebeu = it.quemRecebeu;
      // Shopping: cada pacote foi recebido por uma loja diferente. Aí não
      // dá pra pôr um nome só na pasta — ela vira "VARIAS-LOJAS" e o nome
      // de quem recebeu em cada loja fica no nome de cada arquivo.
      if (it.quemRecebeu && porChave[it.chave].quemRecebeu && it.quemRecebeu !== porChave[it.chave].quemRecebeu) {
        porChave[it.chave].variasLojas = true;
      }
    });
    // "fachadas" aqui é o acervo permanente da rota inteira (todos os
    // endereços já fotografados, de qualquer dia) — só entra no zip a
    // fachada de quem também teve pacote entregue hoje (por isso não cria
    // uma pasta nova aqui, só complementa uma que já existe pelas entregas).
    Object.keys(fachadas).forEach(function (chave) {
      if (!porChave[chave]) return;
      porChave[chave].fotoFachadaUrl = fachadas[chave].fotoFachadaUrl;
    });
    return porChave;
  }

  // Nome da pasta já sai com rua, número e quem recebeu juntos, pra na hora
  // de dar baixa no app da J&T não precisar abrir nada — só olhar o nome da
  // pasta. "prefixo" é o número de ordem (só faz sentido com mais de uma
  // pasta no mesmo zip — o zip de um endereço só não usa).
  function nomePastaZip(g, prefixo) {
    var sufixoPasta = g.variasLojas
      ? "_VARIAS-LOJAS"
      : (g.quemRecebeu ? "_" + sanitizarChaveFirebase(g.quemRecebeu).replace(/\s+/g, "-") : "");
    return (prefixo ? prefixo + "_" : "") + sanitizarChaveFirebase(g.rua).replace(/\s+/g, "-") + "_" + g.numero + sufixoPasta;
  }

  function itensParaZipDoGrupo(g, nomePasta) {
    var itens = [];
    if (g.fotoFachadaUrl) itens.push({ nomePasta: nomePasta, nomeArquivo: "fachada.jpg", url: g.fotoFachadaUrl });
    g.pacotes.forEach(function (p) {
      if (!p.url) return;
      // Sempre inclui o código junto do nome: como vários pacotes do mesmo
      // endereço podem ficar com o mesmo "quem recebeu" (ex: vários
      // "Porteiro" na mesma pasta), o código garante que nenhum arquivo
      // sobrescreva o outro dentro do zip. Quando o próprio pacote tem mais
      // de 1 foto, a 2ª em diante ganha "_2", "_3"... no nome (a 1ª fica sem
      // sufixo, igual sempre foi).
      var nomeArq = sanitizarChaveFirebase(p.nome).replace(/\s+/g, "-") + "_" + p.codigo + (p.slot > 0 ? "_" + (p.slot + 1) : "") + ".jpg";
      itens.push({ nomePasta: nomePasta, nomeArquivo: nomeArq, url: p.url });
    });
    return itens;
  }

  // Baixa tudo em paralelo (rápido), mas só encaixa no zip DEPOIS que tudo já
  // chegou — um de cada vez, na ordem exata da lista recebida. Isso é o que
  // garante a ordem certa dentro do zip, não importa qual foto demorou mais
  // ou menos pra baixar (foi exatamente isso: a pasta 04 baixou mais rápido
  // que a 02 e entrou antes dela no arquivo, quando cada foto entrava assim
  // que terminava de baixar).
  function gerarEBaixarZip(itensParaBuscar, nomeArquivoZip, aoTerminar) {
    // Tenta 3 vezes cada foto antes de desistir dela: uma piscada de rede na
    // hora do download tirava a foto do zip caladamente, e é justamente no
    // zip que a foto vira baixa no app da J&T.
    function baixarComTentativas(url, tentativa) {
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.blob();
      }).catch(function (e) {
        if (tentativa >= 3) return null;
        return new Promise(function (res) { setTimeout(res, 400 * tentativa); })
          .then(function () { return baixarComTentativas(url, tentativa + 1); });
      });
    }
    Promise.all(itensParaBuscar.map(function (it) {
      return baixarComTentativas(it.url, 1);
    })).then(function (blobs) {
      // Se mesmo assim alguma faltou, o entregador PRECISA saber antes de dar
      // baixa — antes o zip saía incompleto sem uma palavra.
      var faltaram = [];
      itensParaBuscar.forEach(function (it, i) { if (!blobs[i]) faltaram.push(it.nomePasta + "/" + it.nomeArquivo); });
      if (faltaram.length) {
        alert("Atenção: " + faltaram.length + " " + plural(faltaram.length, "foto não entrou", "fotos não entraram") + " no zip (não consegui baixar do servidor de fotos).\n\n" +
